<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
<!--
  Material Virtual Machine mark (original artwork for this fork).

  Not Oracle's VirtualBox trademark. A rounded Material 3 "container" square
  in the fork's own generated seed colour (#6750A4, see doc/md3/TonalPalette.md)
  holds two overlapping rounded "window" panes -- a host surface behind a guest
  surface -- standing for one machine running another. The two-shape silhouette
  keeps reading as two stacked windows down to a 16x16 favicon/taskbar size.
-->
<rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="#6750A4"/>
<rect x="54" y="46" width="112" height="112" rx="24" ry="24" fill="#D0BCFF"/>
<rect x="88" y="80" width="120" height="120" rx="26" ry="26" fill="#6750A4"/>
<rect x="94" y="86" width="108" height="108" rx="22" ry="22" fill="#FFFFFF"/>
</svg>
