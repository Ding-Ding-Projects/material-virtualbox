<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notifications and notification centre</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,300..900&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0A0F}
a{color:#D0BCFF}a:hover{color:#EADDFF}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
@keyframes mvToast{0%{opacity:0;transform:translateX(120%)}70%{transform:translateX(-4%)}100%{opacity:1;transform:none}}
@keyframes mvDrain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes mvPanel{from{opacity:0;transform:translateY(-16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes mvRow{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes mvRing{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}
.mv-st{transition:background-color 180ms cubic-bezier(.2,0,0,1),transform 320ms cubic-bezier(.34,1.56,.64,1),color 180ms}
.mv-st:hover{background-color:rgba(230,224,233,.08)}
.mv-st:active{transform:scale(.95)}
.mv-st:focus-visible{outline:3px solid #D0BCFF;outline-offset:2px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="position: relative; overflow: hidden; min-height: 900px; background: #0B0A0F; color: #E6E0E9; font-family: 'Roboto Flex', 'Segoe UI', system-ui, sans-serif; font-size: 14px">
  <header style="display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 18px; background: #141218">
    <span style="font-weight: 800">Material Virtual Machine</span>
    <div style="flex: 1"></div>
    <button class="mv-st" aria-label="Notifications, {{ unread }} unread" aria-expanded="true" style="position: relative; width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; background: #2B2930">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D0BCFF" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="animation: mvRing 1.2s 400ms both; transform-origin: 50% 10%"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10 21h4"></path></svg>
      <span style="position: absolute; top: 4px; right: 4px; min-width: 18px; height: 18px; border-radius: 9px; background: #F2B8B5; color: #601410; font-size: 11px; font-weight: 800; display: grid; place-items: center">{{ unread }}</span>
    </button>
  </header>

  <section aria-label="Notification centre" style="position: absolute; right: 18px; top: 72px; width: 520px; max-height: 560px; padding: 18px; border-radius: 32px; background: rgba(33,31,38,.95); border: 1px solid rgba(202,196,208,.14); box-shadow: 0 30px 80px rgba(0,0,0,.6); display: flex; flex-direction: column; gap: 12px; animation: mvPanel 480ms cubic-bezier(.05,.7,.1,1) both">
    <div style="display: flex; align-items: center; gap: 10px"><h1 style="margin: 0; flex: 1; font-size: 24px; font-weight: 850">Notifications</h1>
      <button class="mv-st" onClick="{{ readAll }}" style="height: 36px; padding: 0 12px; border-radius: 18px; color: #D0BCFF; font-weight: 700">Mark all read</button>
      <button class="mv-st" style="height: 36px; padding: 0 12px; border-radius: 18px; color: #F2B8B5; font-weight: 700">Clear selected</button>
    </div>
    <label style="display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 6px 0 14px; border-radius: 21px; background: #141218; color: #CAC4D0">
      <span style="position: absolute; left: -9999px">Search notifications</span>
      <input placeholder="Search notifications" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent">
      <span title="Regular expression builder" style="font-family: 'Roboto Mono', monospace; font-size: 11px; padding: 6px 9px; border-radius: 14px; background: #2B2930; color: #D0BCFF">.*</span>
    </label>
    <div style="display: flex; flex-direction: column; gap: 6px; overflow: hidden">
      <sc-for list="{{ items }}" as="n" hint-placeholder-count="5">
        <div style="display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 18px; background: {{ n.bg }}; animation: mvRow 400ms cubic-bezier(.05,.7,.1,1) both; animation-delay: {{ n.delay }}; transition: background-color 300ms">
          <span style="width: 34px; height: 34px; flex: none; border-radius: 11px; display: grid; place-items: center; background: {{ n.iconBg }}; color: {{ n.iconFg }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ n.icon }}"></path></svg></span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 750">{{ n.title }}</span><span style="font-size: 12.5px; color: #CAC4D0">{{ n.body }}</span><span style="font-size: 11.5px; color: #938F99">{{ n.when }}</span></span>
          <sc-if value="{{ n.unread }}" hint-placeholder-val="{{ true }}"><span style="width: 10px; height: 10px; margin-top: 6px; border-radius: 5px; background: #D0BCFF"></span></sc-if>
        </div>
      </sc-for>
    </div>
  </section>

  <div aria-live="polite" style="position: absolute; left: 24px; bottom: 24px; display: flex; flex-direction: column-reverse; gap: 10px; width: 420px">
    <sc-for list="{{ toasts }}" as="t" hint-placeholder-count="3">
      <div role="status" style="position: relative; overflow: hidden; display: flex; align-items: center; gap: 12px; padding: 14px 10px 14px 16px; border-radius: 20px; background: {{ t.bg }}; color: {{ t.fg }}; box-shadow: 0 14px 40px rgba(0,0,0,.5); animation: mvToast 600ms cubic-bezier(.34,1.56,.64,1) both; animation-delay: {{ t.delay }}">
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 800">{{ t.title }}</span><span style="font-size: 12.5px; opacity: .85">{{ t.body }}</span></span>
        <sc-if value="{{ t.hasAction }}" hint-placeholder-val="{{ false }}"><button class="mv-st" style="height: 36px; padding: 0 12px; border-radius: 18px; font-weight: 800; color: {{ t.action }}">{{ t.actionLabel }}</button></sc-if>
        <button class="mv-st" aria-label="Dismiss" style="width: 36px; height: 36px; border-radius: 18px; display: grid; place-items: center"><svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
        <sc-if value="{{ t.auto }}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 3px; transform-origin: left; background: {{ t.action }}; animation: mvDrain 6s linear both; animation-delay: {{ t.delay }}"></span></sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { read: false }; }
  renderVals() {
    const ok = 'M5 12l5 5 9-10', warn = 'M12 8v5M12 16.5v.5', err = 'M6 6l12 12M18 6L6 18', info = 'M12 11v6M12 7.5v.5';
    const defs = [['Snapshot taken', 'Before driver update · Windows 11 Dev Box', '2 min ago', ok, '#2E4A2C', '#C4EEBE', true],
      ['USB device busy', 'Logitech Webcam C920 is in use on the host', '6 min ago', warn, '#5C3F1E', '#FFDDB8', true],
      ['Machine aborted', 'FreeBSD Router stopped unexpectedly. Log saved.', '1 h ago', err, '#8C1D18', '#FFDAD6', true],
      ['Export finished', 'Details saved as dev-box.json', 'Yesterday', ok, '#2E4A2C', '#C4EEBE', false],
      ['Update available', 'Material Virtual Machine 7.2.98 is ready to restart', 'Yesterday', info, '#1E3A5F', '#D1E4FF', false]];
    const r = this.state.read;
    const items = defs.map((d, i) => ({ title: d[0], body: d[1], when: d[2], icon: d[3], iconBg: d[4], iconFg: d[5], unread: d[6] && !r, bg: d[6] && !r ? '#2B2340' : '#1D1B20', delay: (i * 60) + 'ms' }));
    const toasts = [['Snapshot taken', 'Before driver update', '#2B2930', '#E6E0E9', '#A6D7A0', true, 'Show', true],
      ['USB device busy', 'Stays until you dismiss it', '#33261A', '#FFDDB8', '#FFB869', true, 'Retry', false],
      ['Machine aborted', 'FreeBSD Router · log saved', '#3A1C1A', '#FFDAD6', '#F2B8B5', true, 'Open log', false]]
      .map((t, i) => ({ title: t[0], body: t[1], bg: t[2], fg: t[3], action: t[4], hasAction: t[5], actionLabel: t[6], auto: t[7], delay: (300 + i * 260) + 'ms' }));
    return { items, toasts, unread: r ? 0 : 3, readAll: () => this.setState({ read: true }) };
  }
}
</script>
</body>
</html>
