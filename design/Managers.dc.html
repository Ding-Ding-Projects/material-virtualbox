<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#141218;color:#E6E0E9;font-family:"Roboto Flex","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  *{box-sizing:border-box}
  a{color:#D0BCFF;text-decoration:none}
  a:hover{color:#EADDFF;text-decoration:underline}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input,select,textarea{font:inherit;color:inherit}
  input[type=range]{accent-color:#D0BCFF}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#49454F;border-radius:8px}
  @keyframes mvmIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
</helmet>

<div style="height:100vh;display:flex;flex-direction:column;background:#141218;overflow:hidden;font-size:13px">

  <div style="height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 6px 0 12px;background:#1D1B20;border-bottom:1px solid #2B2930">
    <div style="width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:8px;background:#D0BCFF;color:#381E72;font-weight:700;font-size:14px">{{ brandMark }}</div>
    <div style="font-size:13px;font-weight:600;white-space:nowrap">{{ toolTitle }}</div>
    <div style="flex:1;min-width:8px"></div>
    <div style="flex:none;display:flex;gap:4px;font-size:11.5px">
      <a href="Manager.dc.html" style="padding:5px 10px;border-radius:12px;background:#2B2930;color:#CAC4D0">Manager</a>
      <a href="VM Settings.dc.html" style="padding:5px 10px;border-radius:12px;background:#2B2930;color:#CAC4D0">Settings</a>
      <a href="Runtime Window.dc.html" style="padding:5px 10px;border-radius:12px;background:#2B2930;color:#CAC4D0">Runtime</a>
      <a href="Wizards.dc.html" style="padding:5px 10px;border-radius:12px;background:#2B2930;color:#CAC4D0">Wizards</a>
    </div>
    <div style="flex:none;display:flex;gap:2px;margin-left:6px">
      <button onClick="{{ winMinimize }}" style="width:38px;height:32px;border-radius:8px;color:#CAC4D0" style-hover="background:#2B2930">─</button>
      <button onClick="{{ winMaximize }}" style="width:38px;height:32px;border-radius:8px;color:#CAC4D0" style-hover="background:#2B2930">▢</button>
      <button onClick="{{ winClose }}" style="width:38px;height:32px;border-radius:8px;color:#CAC4D0" style-hover="background:#93000A;color:#FFDAD6">✕</button>
    </div>
  </div>

  <div style="flex:none;display:flex;align-items:center;gap:6px;padding:12px 18px 8px;overflow-x:auto">
    <sc-for list="{{ toolTabs }}" as="t" hint-placeholder-count="6">
      <button onClick="{{ t.select }}" style="flex:none;height:34px;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:17px;background:{{ t.bg }};color:{{ t.fg }};font-size:12.5px;font-weight:600;white-space:nowrap" style-hover="filter:brightness(1.15)">
        <span style="width:16px;height:16px;flex:none;background-image:{{ t.iconCss }};background-size:contain;background-repeat:no-repeat;background-position:center"></span><span>{{ t.label }}</span>
      </button>
    </sc-for>
  </div>

  <div style="flex:1;min-height:0;display:flex;gap:12px;padding:0 18px 12px;min-width:0">

    <sc-if value="{{ showSubnav }}" hint-placeholder-val="{{ false }}">
      <div style="width:196px;flex:none;min-width:0;display:flex;flex-direction:column;gap:2px;background:#1D1B20;border:1px solid #2B2930;border-radius:16px;padding:8px;overflow-y:auto">
        <sc-for list="{{ subPages }}" as="p" hint-placeholder-count="7">
          <button onClick="{{ p.select }}" style="display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:{{ p.bg }};color:{{ p.fg }};text-align:left;min-width:0" style-hover="background:#2B2930">
            <span style="width:17px;height:17px;flex:none;background-image:{{ p.iconCss }};background-size:contain;background-repeat:no-repeat;background-position:center"></span>
            <span style="flex:1;min-width:0;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis">{{ p.label }}</span>
          </button>
        </sc-for>
      </div>
    </sc-if>

    <div style="flex:1;min-width:0;display:flex;flex-direction:column;background:#1D1B20;border:1px solid #2B2930;border-radius:16px;overflow:hidden">
      <div style="flex:none;display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid #2B2930;min-width:0">
        <div style="flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:18px;background:#2B2930">
          <span style="color:#938F99">⌕</span>
          <input value="{{ searchQuery }}" onInput="{{ setSearch }}" placeholder="{{ searchPlaceholder }}" style="flex:1;min-width:0;background:none;border:0;outline:none;font-size:12.5px" />
          <span style="font-size:10px;font-family:'Roboto Mono',monospace;color:#D0BCFF;white-space:nowrap">{{ regexBadge }}</span>
        </div>
        <button onClick="{{ openRegex }}" title="Regex builder for this field" style="width:36px;height:36px;flex:none;border-radius:12px;background:#4F378B;color:#EADDFF;font-family:'Roboto Mono',monospace;font-weight:600" style-hover="filter:brightness(1.15)">.*</button>
        <button onClick="{{ openAppearance }}" title="Edit appearance of this pane" style="width:36px;height:36px;flex:none;border-radius:12px;color:#CAC4D0" style-hover="background:#2B2930">✎</button>
      </div>
      <div style="flex:1;min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;padding:14px">{{ paneBody }}</div>
    </div>
  </div>

  <div style="flex:none;display:flex;align-items:center;gap:10px;padding:0 18px 14px;min-width:0">
    <div style="flex:1;min-width:0;font-size:11.5px;color:#938F99;overflow:hidden;text-overflow:ellipsis">{{ statusText }}</div>
    <button onClick="{{ resetTool }}" style="flex:none;height:38px;padding:0 16px;border-radius:19px;color:#D0BCFF;font-size:12.5px;font-weight:600" style-hover="background:#2B2930">Reset</button>
    <button onClick="{{ applyTool }}" style="flex:none;height:38px;padding:0 20px;border-radius:19px;background:#D0BCFF;color:#381E72;font-size:12.5px;font-weight:600" style-hover="filter:brightness(1.12)">{{ applyLabel }}</button>
  </div>

  <sc-if value="{{ overlayOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#00000099;backdrop-filter:blur(3px)">
      <div style="width:min(660px,calc(100vw - 64px));max-height:calc(100vh - 90px);display:flex;flex-direction:column;background:#211F26;border:1px solid #36343B;border-radius:28px;box-shadow:0 24px 60px #000000aa;animation:mvmIn .2s cubic-bezier(.05,.7,.1,1);overflow:hidden">
        <div style="flex:none;display:flex;align-items:flex-start;gap:12px;padding:22px 24px 12px">
          <div style="flex:1;min-width:0">
            <div style="font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#D0BCFF">{{ overlayEyebrow }}</div>
            <div style="font-size:20px;font-weight:500;margin-top:3px">{{ overlayTitle }}</div>
          </div>
          <button onClick="{{ closeOverlay }}" style="width:34px;height:34px;flex:none;border-radius:17px;color:#CAC4D0" style-hover="background:#36343B">✕</button>
        </div>
        <div style="flex:1;min-height:0;overflow-y:auto;padding:0 24px 22px">{{ overlayBody }}</div>
      </div>
    </div>
  </sc-if>

  <div style="position:fixed;right:20px;bottom:20px;z-index:50;display:flex;flex-direction:column;gap:8px;width:330px">
    <sc-for list="{{ toasts }}" as="t" hint-placeholder-count="0">
      <div style="padding:12px 14px;border-radius:14px;background:#36343B;border-left:3px solid {{ t.accent }};box-shadow:0 8px 26px #000000aa;animation:mvmIn .2s ease">
        <div style="font-size:12.5px;font-weight:600">{{ t.title }}</div>
        <div style="font-size:11.5px;color:#CAC4D0;margin-top:2px">{{ t.detail }}</div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;brandMark&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;M&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Branding&quot;}}">
const T = {
  primary: '#D0BCFF', onPrimary: '#381E72', primaryContainer: '#4F378B', onPrimaryContainer: '#EADDFF',
  secondaryContainer: '#4A4458', onSecondaryContainer: '#E8DEF8', surfaceHigh: '#2B2930', surfaceHighest: '#36343B',
  onSurface: '#E6E0E9', onSurfaceVar: '#CAC4D0', outline: '#938F99', outlineVar: '#49454F', error: '#F2B8B5', ok: '#7ED9A6'
};
const I = (n) => 'icons/' + n;
const h = React.createElement;

const TOOLS = [
  { id: 'media', label: 'Virtual Media Manager', icon: 'media_manager_24px.png' },
  { id: 'network', label: 'Network Manager', icon: 'host_iface_manager_24px.png' },
  { id: 'extensions', label: 'Extension Pack Manager', icon: 'extension_pack_manager_24px.png' },
  { id: 'cloud', label: 'Cloud Profile Manager', icon: 'cloud_profile_manager_24px.png' },
  { id: 'logs', label: 'Log Viewer', icon: 'vm_show_logs_24px.png' },
  { id: 'activity', label: 'VM Activity Overview', icon: 'performance_monitor_24px.png' },
  { id: 'prefs', label: 'Preferences', icon: 'tools_menu_24px.png' }
];
/* GlobalSettingsPageType_* from UIAdvancedSettingsDialogSpecific.cpp */
const PREF_PAGES = [
  { id: 'general', label: 'General', icon: 'machine_16px.png' },
  { id: 'input', label: 'Input', icon: 'interface_16px.png' },
  { id: 'shortcuts', label: 'Shortcuts', icon: 'interface_16px.png' },
  { id: 'update', label: 'Update', icon: 'tools_menu_24px.png' },
  { id: 'language', label: 'Language', icon: 'description_16px.png' },
  { id: 'display', label: 'Display', icon: 'vrdp_16px.png' },
  { id: 'proxy', label: 'Proxy', icon: 'nw_16px.png' },
  { id: 'interface', label: 'Interface', icon: 'interface_16px.png' },
  { id: 'appearance', label: 'Appearance', icon: 'vrdp_16px.png' },
  { id: 'tabs', label: 'Tabs & Groups', icon: 'sf_16px.png' },
  { id: 'search', label: 'Search & Regex', icon: 'description_16px.png' },
  { id: 'notifications', label: 'Notifications', icon: 'tools_menu_24px.png' },
  { id: 'history', label: 'History', icon: 'snapshot_manager_24px.png' },
  { id: 'defaults', label: 'Machine Defaults', icon: 'chipset_16px.png' },
  { id: 'storage', label: 'Storage', icon: 'hd_16px.png' },
  { id: 'networkdef', label: 'Network Defaults', icon: 'nw_16px.png' },
  { id: 'privacy', label: 'Privacy & Security', icon: 'usb_16px.png' },
  { id: 'advanced', label: 'Advanced', icon: 'performance_monitor_24px.png' }
];

const PREF_KEYWORDS = {
  general: 'default machine folder vrdp authentication library host screensaver',
  input: 'host key combination auto capture keyboard shortcuts',
  shortcuts: 'shortcuts keybindings rebind manager runtime conflicts',
  update: 'check for updates period branch stable pre-release unsigned restart',
  language: 'interface language english cantonese deutsch francais japanese translation',
  display: 'maximum guest screen size hint width height font scaling',
  proxy: 'proxy auto-detect direct connection manual url',
  interface: 'language mode playful cantonese bilingual narrator window chrome title bar rail drawer tab strip status bar branding application name wordmark theme density seed named themes',
  appearance: 'theme color density corner radius font family weight seed motion easing reduce elevation ripple per-element overrides named themes',
  tabs: 'tab strip new tab minimum width restore tabs confirm bulk close pinned groups decoration collapse close tools inverse regex',
  search: 'default match mode plain text regex flags timeout result limit builder highlight command palette shortcut grouping teleport stale saved searches',
  notifications: 'toast duration position keep centre sound categories machine state snapshot storage media network extension packs updates destructive guest control',
  history: 'revisions retention repository location record restore append-only compact export verify integrity',
  defaults: 'new machine defaults base memory processors disk size graphics controller chipset pointing device efi audio optical unattended',
  storage: 'disk images default format allocation dynamic fixed snapshot folder low disk warning host io cache solid-state delete disk files',
  networkdef: 'new adapter defaults attached nat bridged host-only internal adapter type promiscuous host-only prefix cable mac clone',
  privacy: 'destructive-action gate two keys slider type machine name scope snapshots extension packs secrets passwords redact paths telemetry',
  advanced: 'experimental machine settings nested virtualization developer diagnostics logging level keep log files reset preferences'
};

class Component extends DCLogic {
  state = {
    tool: 'media', prefPage: 'general', searchQuery: '', prefSearch: {}, regexApplied: {}, overlay: null, toasts: [],
    regexPattern: '', regexFlags: 'iu', regexSample: 'Win11-Dev.vdi',
    appearance: { target: '', radius: 16, scale: 1, font: 'Roboto Flex', seed: '#6750A4' },
    media: [
      { id: 'm1', name: 'Win11-Dev.vdi', kind: 'Hard disk', virtual: '120 GB', actual: '41.2 GB', format: 'VDI', type: 'Normal', attached: 'Win11-Dev', encrypted: false },
      { id: 'm2', name: 'Ubuntu-24.04.vdi', kind: 'Hard disk', virtual: '60 GB', actual: '18.9 GB', format: 'VDI', type: 'Normal', attached: 'Ubuntu-24.04', encrypted: false },
      { id: 'm3', name: 'Debian-Build.vdi', kind: 'Hard disk', virtual: '240 GB', actual: '96.4 GB', format: 'VDI', type: 'Immutable', attached: 'Debian-Build', encrypted: true },
      { id: 'm4', name: 'ubuntu-24.04.iso', kind: 'Optical disk', virtual: '5.7 GB', actual: '5.7 GB', format: 'ISO', type: 'Read-only', attached: '—', encrypted: false }
    ],
    selectedMedium: 'm1',
    networks: [
      { id: 'n1', name: 'vboxnet0', kind: 'Host-only', ipv4: '192.168.56.1', mask: '255.255.255.0', dhcp: true, dhcpFrom: '192.168.56.101', dhcpTo: '192.168.56.254' },
      { id: 'n2', name: 'qa-net', kind: 'NAT Network', ipv4: '10.0.2.0/24', mask: '', dhcp: true, dhcpFrom: '10.0.2.10', dhcpTo: '10.0.2.200' },
      { id: 'n3', name: 'buildnet', kind: 'Internal', ipv4: '', mask: '', dhcp: false, dhcpFrom: '', dhcpTo: '' }
    ],
    selectedNetwork: 'n1',
    packs: [
      { id: 'p1', name: 'Oracle VM VirtualBox Extension Pack', version: '7.2.0 r170000', usable: true, description: 'USB 2.0/3.0, VRDP, disk encryption, NVMe and PXE boot for Intel cards.' },
      { id: 'p2', name: 'VNC', version: '7.2.0 r170000', usable: true, description: 'VNC remote display server as an alternative to VRDP.' }
    ],
    selectedPack: 'p1',
    profiles: [{ id: 'c1', name: 'dev-tenancy', provider: 'Oracle Cloud Infrastructure', region: 'eu-frankfurt-1', machines: 3 }],
    selectedProfile: 'c1',
    logMachine: 'Win11-Dev', logQuery: '',
    prefs: {
      defaultFolder: 'C:\\Users\\you\\VirtualBox VMs', vrdpLibrary: 'VBoxAuth', hostScreensaver: false,
      hostKey: 'Right Ctrl', autoCapture: true,
      checkUpdates: true, updatePeriod: 'Once per week', updateBranch: 'Stable release versions',
      language: 'English (built-in)', maxGuestSize: 'Automatic', maxWidth: 1920, maxHeight: 1200, fontScale: 100,
      proxyMode: 'Auto-detect host proxy settings', proxyUrl: '',
      colorTheme: 'Dark', accent: '#6750A4', density: 'Comfortable', notificationCenterKeep: true, appName: 'Material Virtual Machine', wordmark: 'M'
    }
  };

  toast(title, detail, accent) {
    const id = Math.random().toString(16).slice(2);
    this.setState((s) => ({ toasts: [...s.toasts, { id, title, detail, accent: accent || T.primary }] }));
    setTimeout(() => this.setState((s) => ({ toasts: s.toasts.filter((t) => t.id !== id) })), 3200);
  }
  setPref(patch) { this.setState((s) => ({ prefs: Object.assign({}, s.prefs, patch) })); }
  match(text) {
    const q = this.state.searchQuery;
    if (!q) return true;
    const applied = this.state.regexApplied[this.state.tool];
    if (applied) { try { return new RegExp(applied.pattern, applied.flags).test(text); } catch (e) { return false; } }
    return String(text).toLowerCase().includes(q.toLowerCase());
  }

  /* ---------- controls ---------- */
  card(title, children) {
    return h('div', { key: title, style: { background: T.surfaceHigh, borderRadius: 16, padding: '14px 16px', marginBottom: 10, minWidth: 0 } },
      h('div', { style: { fontSize: 12.5, fontWeight: 700, color: T.primary, marginBottom: 12 } }, title), children);
  }
  grid(children, cols) { return h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(' + (cols || 2) + ',minmax(0,1fr))', gap: 12, minWidth: 0 } }, children); }
  field(label, node, hint) {
    return h('label', { key: label, style: { display: 'grid', gap: 5, minWidth: 0 } },
      h('span', { style: { fontSize: 11.5, fontWeight: 700, color: T.outline } }, label), node,
      hint ? h('span', { style: { fontSize: 10.5, color: T.outline } }, hint) : null);
  }
  text(value, onChange, props) {
    return h('input', Object.assign({ value, onChange }, props || {}, { style: { width: '100%', height: 40, padding: '0 12px', borderRadius: 12, background: T.surfaceHighest, border: '1px solid ' + T.outlineVar, outline: 'none', fontSize: 12.5, color: T.onSurface } }));
  }
  combo(value, options, onChange) {
    return h('select', { value, onChange, style: { width: '100%', height: 40, padding: '0 10px', borderRadius: 12, background: T.surfaceHighest, border: '1px solid ' + T.outlineVar, outline: 'none', fontSize: 12.5, color: T.onSurface } }, options.map((o) => h('option', { key: o, value: o }, o)));
  }
  check(label, checked, onChange, hint) {
    return h('label', { key: label, style: { display: 'flex', alignItems: 'flex-start', gap: 9, padding: '7px 0', fontSize: 12.5, cursor: 'pointer' } },
      h('input', { type: 'checkbox', checked, onChange, style: { width: 16, height: 16, marginTop: 1, accentColor: T.primary } }),
      h('span', null, label, hint ? h('span', { style: { display: 'block', fontSize: 10.5, color: T.outline, marginTop: 2 } }, hint) : null));
  }
  btn(label, onClick, kind, disabled) {
    const map = { filled: { background: T.primary, color: T.onPrimary }, tonal: { background: T.secondaryContainer, color: T.onSecondaryContainer }, text: { background: 'transparent', color: T.primary }, outlined: { background: 'transparent', color: T.onSurfaceVar, border: '1px solid ' + T.outlineVar } };
    return h('button', { key: label, onClick: disabled ? undefined : onClick, disabled: Boolean(disabled), style: Object.assign({ height: 34, padding: '0 14px', borderRadius: 17, fontSize: 12, fontWeight: 600, whiteSpace: 'nowrap', opacity: disabled ? .45 : 1 }, map[kind || 'tonal']) }, label);
  }
  list(items, selectedId, onSelect, render) {
    return h('div', { style: { display: 'grid', gap: 4, marginBottom: 10 } }, items.length ? items.map((it) => h('button', {
      key: it.id, onClick: () => onSelect(it.id),
      style: { display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px', borderRadius: 12, background: selectedId === it.id ? T.secondaryContainer : T.surfaceHigh, textAlign: 'left', minWidth: 0 }
    }, render(it))) : [h('div', { key: 'e', style: { padding: 14, borderRadius: 12, background: T.surfaceHigh, color: T.outline, fontSize: 12.5 } }, 'Nothing matches this search.')]);
  }

  /* ---------- tool panes ---------- */
  mediaPane() {
    const s = this.state;
    const rows = s.media.filter((m) => this.match(m.name + ' ' + m.kind + ' ' + m.attached + ' ' + m.type));
    const sel = s.media.find((m) => m.id === s.selectedMedium);
    const upd = (patch) => this.setState({ media: s.media.map((m) => m.id === sel.id ? Object.assign({}, m, patch) : m) });
    return h('div', null,
      h('div', { style: { display: 'flex', gap: 8, marginBottom: 12, flexWrap: 'wrap' } },
        this.btn('Create…', () => { window.location.href = 'Wizards.dc.html'; }, 'filled'),
        this.btn('Copy…', () => sel && this.setState({ media: [...s.media, Object.assign({}, sel, { id: 'm' + Date.now(), name: sel.name.replace(/(\.\w+)$/, '_copy$1'), attached: '—' })] }) && this.toast('Copied', sel.name), 'tonal', !sel),
        this.btn('Move…', () => sel && this.toast('Moved', sel.name + ' relocated'), 'tonal', !sel),
        this.btn('Release', () => { if (!sel) return; upd({ attached: '—' }); this.toast('Released', sel.name + ' detached from its machine'); }, 'outlined', !sel),
        this.btn('Remove', () => { if (!sel) return; this.setState({ media: s.media.filter((m) => m.id !== sel.id), selectedMedium: '' }); this.toast('Removed', sel.name, T.error); }, 'outlined', !sel),
        this.btn('Refresh', () => this.toast('Refreshed', 'Media inventory reloaded'), 'text')),
      this.list(rows, s.selectedMedium, (id) => this.setState({ selectedMedium: id }), (it) => [
        h('img', { key: 'i', src: I('hd_16px.png'), alt: '', style: { width: 16, height: 16 } }),
        h('span', { key: 'n', style: { flex: 1, minWidth: 0 } },
          h('b', { style: { fontSize: 12.5 } }, it.name),
          h('small', { style: { display: 'block', fontSize: 11, color: T.outline } }, it.kind + ' · ' + it.type + ' · attached to ' + it.attached)),
        h('span', { key: 's', style: { fontSize: 11, color: T.outline, whiteSpace: 'nowrap' } }, it.actual + ' / ' + it.virtual)
      ]),
      sel ? this.card('Attributes · ' + sel.name, h('div', null,
        this.grid([
          this.field('Type', this.combo(sel.type, ['Normal', 'Immutable', 'Writethrough', 'Shareable', 'Multi-attach', 'Read-only'], (e) => upd({ type: e.target.value }))),
          this.field('Format', this.combo(sel.format, ['VDI', 'VMDK', 'VHD', 'ISO'], (e) => upd({ format: e.target.value }))),
          this.field('Location', this.text('C:\\Users\\you\\VirtualBox VMs\\' + sel.name, () => {}, { readOnly: true })),
          this.field('Description', this.text(sel.description || '', (e) => upd({ description: e.target.value }), { placeholder: 'Optional' }))
        ]),
        h('div', { style: { marginTop: 8 } }, this.check('Encrypted with AES-XTS256', sel.encrypted, (e) => upd({ encrypted: e.target.checked }))))) : null);
  }

  networkPane() {
    const s = this.state;
    const rows = s.networks.filter((n) => this.match(n.name + ' ' + n.kind + ' ' + n.ipv4));
    const sel = s.networks.find((n) => n.id === s.selectedNetwork);
    const upd = (patch) => this.setState({ networks: s.networks.map((n) => n.id === sel.id ? Object.assign({}, n, patch) : n) });

  paneBody() {
    const map = { media: 'mediaPane', network: 'networkPane', extensions: 'extensionsPane', cloud: 'cloudPane', logs: 'logsPane', activity: 'activityPane', prefs: 'prefsPane' };
    return this[map[this.state.tool]]();
  }

  /* ---------- overlays ---------- */
  regexBody() {
    const s = this.state;
    let ok = true, feedback = 'Plain text is the default. Applying a pattern switches this field to regex.';
    try { if (s.regexPattern) new RegExp(s.regexPattern, s.regexFlags); } catch (e) { ok = false; feedback = e.message; }
    let preview = '';
    if (ok && s.regexPattern) { try { const mt = s.regexSample.match(new RegExp(s.regexPattern, s.regexFlags)); preview = mt ? 'Match: ' + mt[0] : 'No match in sample.'; } catch (e) {} }
    const constructs = [['Any', '.'], ['Digit', '\\d'], ['Word', '\\w'], ['Space', '\\s'], ['Start', '^'], ['End', '$'], ['Group', '()'], ['Class', '[]'], ['Or', '|'], ['0+', '*'], ['1+', '+'], ['Opt', '?']];
    return h('div', null,
      this.field('Pattern', this.text(s.regexPattern, (e) => this.setState({ regexPattern: e.target.value }), { placeholder: '\\.vdi$', spellCheck: false })),
      h('div', { style: { display: 'flex', gap: 6, flexWrap: 'wrap', margin: '10px 0' } }, constructs.map(([label, token]) => h('button', {
        key: token, onClick: () => this.setState((st) => ({ regexPattern: st.regexPattern + token })),
        style: { height: 30, padding: '0 11px', borderRadius: 15, background: T.surfaceHigh, color: T.onSurfaceVar, fontSize: 11.5, fontWeight: 600 }
      }, label + '  ' + token))),
      this.grid([
        this.field('Flags', this.text(s.regexFlags, (e) => this.setState({ regexFlags: e.target.value }), { maxLength: 8 })),
        this.field('Sample text', this.text(s.regexSample, (e) => this.setState({ regexSample: e.target.value })))
      ]),
      h('div', { style: { marginTop: 12, padding: 11, borderRadius: 12, background: ok ? T.surfaceHigh : '#4E1B1B', color: ok ? T.onSurfaceVar : T.error, fontSize: 12 } }, feedback),
      preview ? h('div', { style: { marginTop: 8, padding: 11, borderRadius: 12, background: '#0F0D13', fontFamily: 'Roboto Mono, monospace', fontSize: 11.5 } }, preview) : null,
      h('div', { style: { display: 'flex', justifyContent: 'space-between', marginTop: 14 } },
        this.btn('Clear', () => { const next = Object.assign({}, s.regexApplied); delete next[s.tool]; this.setState({ regexApplied: next, regexPattern: '', overlay: null }); this.toast('Plain text restored', s.tool); }, 'text'),
        this.btn('Apply pattern', () => {
          if (!ok || !s.regexPattern) return this.toast('Not applied', 'Enter a valid pattern first', T.error);
          this.setState({ regexApplied: Object.assign({}, s.regexApplied, { [s.tool]: { pattern: s.regexPattern, flags: s.regexFlags } }), overlay: null });
          this.toast('Regex applied', '/' + s.regexPattern + '/' + s.regexFlags);
        }, 'filled')));
  }

    const s = this.state;

    const overlayMeta = { regex: ['Search tool', 'Regex builder'], appearance: ['Element appearance', 'Edit appearance'], confirmUninstall: ['Safety gate', 'Uninstall extension pack'] }[s.overlay] || ['', ''];
    const bodies = { regex: () => this.regexBody(), appearance: () => this.appearanceBody(), confirmUninstall: () => this.confirmUninstallBody() };
    const applied = s.regexApplied[s.tool];

    return {
      brandMark: this.props.brandMark ?? 'M',
      toolTitle: tool.label,
      toolTabs: TOOLS.map((t) => ({
        label: t.label.replace(' Manager', '').replace('VM Activity Overview', 'Activity'), iconCss: 'url("' + I(t.icon) + '")',

      })),
      showSubnav: s.tool === 'prefs',
      subPages: (s.tool === 'prefs' ? PREF_PAGES.filter((p) => this.match(p.label + ' ' + (PREF_KEYWORDS[p.id] || ''))) : PREF_PAGES).map((p) => ({

      })),
      searchQuery: s.searchQuery,
      setSearch: (e) => this.setState({ searchQuery: e.target.value }),
      searchPlaceholder: s.tool === 'prefs' ? 'Search preference pages — the in-page field searches sections' : 'Search ' + tool.label.toLowerCase(),
      regexBadge: applied ? '/' + applied.pattern + '/' + applied.flags : '',
      openRegex: () => this.setState({ overlay: 'regex' }),
      openAppearance: () => this.setState({ overlay: 'appearance', appearance: Object.assign({}, s.appearance, { target: tool.label }) }),
      paneBody: this.paneBody(),
      statusText: s.tool === 'prefs' ? this.visiblePrefPages().length + ' of ' + PREF_PAGES.length + ' preference pages · settings persist in VirtualBox extradata and roam with VBoxSVC.' : tool.label + ' · local inventory',
      applyLabel: s.tool === 'prefs' ? 'Apply' : 'Close',
      applyTool: () => { if (s.tool === 'prefs') this.toast('Applied', 'Global preferences written to extradata'); else window.location.href = 'Manager.dc.html'; },
      resetTool: () => { this.setState({ searchQuery: '', regexApplied: {} }); this.toast('Reset', 'Search and filters cleared'); },
      winMinimize: () => this.toast('Minimize', 'Window minimized'),
      winMaximize: () => this.toast('Maximize', 'Window toggled maximized'),
      winClose: () => { window.location.href = 'Manager.dc.html'; },
      overlayOpen: Boolean(s.overlay), overlayEyebrow: overlayMeta[0], overlayTitle: overlayMeta[1],
      overlayBody: s.overlay ? bodies[s.overlay]() : null,
      closeOverlay: () => this.setState({ overlay: null }),
      toasts: s.toasts
    };
  }
}
</script>
</body>
</html>
