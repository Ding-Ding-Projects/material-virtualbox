<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#141218;color:#E6E0E9;font-family:"Roboto Flex","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  *{box-sizing:border-box}
  a{color:#D0BCFF;text-decoration:none}
  a:hover{color:#EADDFF;text-decoration:underline}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input,select,textarea{font:inherit;color:inherit}
  input[type=range]{accent-color:#D0BCFF}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#49454F;border-radius:8px}
  ::-webkit-scrollbar-track{background:transparent}
  @keyframes mvmIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>
</helmet>

<div style="height:100vh;display:flex;flex-direction:column;background:#141218;overflow:hidden;font-size:13px">

  <div style="height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 6px 0 12px;background:#1D1B20;border-bottom:1px solid #2B2930">
    <div style="width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:8px;background:#D0BCFF;color:#381E72;font-weight:700;font-size:14px">{{ brandMark }}</div>
    <div style="font-size:13px;font-weight:600;white-space:nowrap">{{ brandName }}</div>
    <div style="font-size:12px;color:#938F99;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0">Manager</div>
    <div style="flex:1;min-width:8px"></div>
    <div style="flex:none;display:flex;gap:4px;font-size:11.5px">
      <a href="VM Settings.dc.html" style="padding:5px 10px;border-radius:12px;background:#2B2930;color:#CAC4D0">Settings</a>
      <a href="Runtime Window.dc.html" style="padding:5px 10px;border-radius:12px;background:#2B2930;color:#CAC4D0">Runtime</a>
      <a href="Wizards.dc.html" style="padding:5px 10px;border-radius:12px;background:#2B2930;color:#CAC4D0">Wizards</a>
      <a href="Managers.dc.html" style="padding:5px 10px;border-radius:12px;background:#2B2930;color:#CAC4D0">Managers</a>
    </div>
    <button onClick="{{ openPalette }}" title="Command palette · Ctrl+Shift+F" style="flex:none;display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:15px;background:#2B2930;color:#CAC4D0;font-size:12px;white-space:nowrap" style-hover="background:#36343B;color:#E6E0E9">
      <span>⌕</span><span>Search everything</span><span style="font-family:'Roboto Mono',monospace;font-size:10px;color:#938F99;border:1px solid #49454F;border-radius:4px;padding:1px 5px">Ctrl+Shift+F</span>
    </button>
    <button onClick="{{ openNotifications }}" title="Notification centre" style="flex:none;width:34px;height:30px;border-radius:15px;color:#CAC4D0;position:relative" style-hover="background:#2B2930">
      <span style="font-size:15px">◉</span>
      <sc-if value="{{ hasUnread }}" hint-placeholder-val="{{ true }}"><span style="position:absolute;top:3px;right:6px;width:7px;height:7px;border-radius:50%;background:#F2B8B5"></span></sc-if>
    </button>
    <div style="flex:none;display:flex;gap:2px;margin-left:6px">
      <button onClick="{{ winMinimize }}" title="Minimize" style="width:38px;height:32px;border-radius:8px;color:#CAC4D0" style-hover="background:#2B2930">─</button>
      <button onClick="{{ winMaximize }}" title="Maximize" style="width:38px;height:32px;border-radius:8px;color:#CAC4D0" style-hover="background:#2B2930">▢</button>
      <button onClick="{{ winClose }}" title="Close" style="width:38px;height:32px;border-radius:8px;color:#CAC4D0" style-hover="background:#93000A;color:#FFDAD6">✕</button>
    </div>
  </div>

  <div style="height:40px;flex:none;display:flex;align-items:flex-end;gap:3px;padding:0 8px;background:#1D1B20;border-bottom:1px solid #2B2930;min-width:0">
    <div style="flex:1;min-width:0;display:flex;align-items:flex-end;gap:3px;overflow-x:auto;overflow-y:hidden">
      <sc-for list="{{ openTabs }}" as="tab" hint-placeholder-count="3">
        <button onClick="{{ tab.select }}" onContextMenu="{{ tab.menu }}" title="{{ tab.title }}" style="flex:none;height:32px;max-width:210px;min-width:120px;display:flex;align-items:center;gap:7px;padding:0 10px;border-radius:10px 10px 0 0;background:{{ tab.bg }};color:{{ tab.fg }};font-size:12px;font-weight:500;white-space:nowrap">
          <span style="width:6px;height:6px;flex:none;border-radius:50%;background:{{ tab.dot }}"></span>
          <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:left">{{ tab.label }}</span>
          <span onClick="{{ tab.close }}" style="width:16px;height:16px;flex:none;display:grid;place-items:center;border-radius:50%;color:#938F99;font-size:11px" style-hover="background:#49454F;color:#E6E0E9">✕</span>
        </button>
      </sc-for>
    </div>
    <button onClick="{{ newTab }}" title="New tab" style="flex:none;width:30px;height:30px;margin-bottom:2px;border-radius:8px;color:#CAC4D0;font-size:16px" style-hover="background:#2B2930">＋</button>
    <button onClick="{{ openTabManager }}" title="Tabs, groups and safe closing" style="flex:none;width:30px;height:30px;margin-bottom:2px;border-radius:8px;color:#CAC4D0;font-size:14px" style-hover="background:#2B2930">☰</button>
  </div>

  <div style="flex:1;min-height:0;display:flex">

    <div style="width:92px;flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px;background:#1D1B20;border-right:1px solid #2B2930;overflow-y:auto">
      <sc-for list="{{ railItems }}" as="item" hint-placeholder-count="7">
        <button onClick="{{ item.select }}" title="{{ item.hint }}" style="width:100%;display:grid;justify-items:center;gap:3px;padding:5px 0 7px;border-radius:16px;color:{{ item.fg }}" style-hover="background:#2B2930">
          <span style="width:54px;height:30px;display:grid;place-items:center;border-radius:15px;background:{{ item.pill }}"><span style="width:22px;height:22px;background-image:{{ item.iconCss }};background-size:contain;background-repeat:no-repeat;background-position:center"></span></span>
          <span style="font-size:10.5px;font-weight:600;white-space:nowrap">{{ item.label }}</span>
        </button>
      </sc-for>
      <div style="flex:1"></div>
      <button onClick="{{ openPreferences }}" title="Global preferences" style="width:100%;display:grid;justify-items:center;gap:3px;padding:5px 0 7px;border-radius:16px;color:#CAC4D0" style-hover="background:#2B2930">
        <span style="width:54px;height:30px;display:grid;place-items:center;border-radius:15px;font-size:16px">⚙</span>
        <span style="font-size:10.5px;font-weight:600">Preferences</span>
      </button>
    </div>

    <div style="flex:1;min-width:0;display:flex;flex-direction:column">

      <div style="flex:none;display:flex;align-items:center;gap:10px;padding:14px 20px 10px;min-width:0">
        <div style="min-width:0">
          <div style="font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#D0BCFF">{{ eyebrow }}</div>
          <div style="font-size:22px;font-weight:500;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ pageTitle }}</div>
        </div>
        <div style="flex:1;min-width:8px"></div>
        <div style="flex:none;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
          <sc-for list="{{ pageActions }}" as="act" hint-placeholder-count="4">
            <button onClick="{{ act.run }}" title="{{ act.hint }}" style="height:36px;display:flex;align-items:center;gap:7px;padding:0 16px;border-radius:18px;background:{{ act.bg }};color:{{ act.fg }};border:{{ act.border }};font-size:12.5px;font-weight:600;white-space:nowrap" style-hover="filter:brightness(1.12)">
              <span style="width:16px;height:16px;flex:none;background-image:{{ act.iconCss }};background-size:contain;background-repeat:no-repeat;background-position:center"></span>
              <span>{{ act.label }}</span>
            </button>
          </sc-for>
        </div>
      </div>

      <div style="flex:1;min-height:0;display:flex;gap:12px;padding:0 20px 14px;min-width:0">

        <sc-if value="{{ showChooser }}" hint-placeholder-val="{{ true }}">
          <div style="width:274px;flex:none;min-width:0;display:flex;flex-direction:column;gap:8px;background:#1D1B20;border:1px solid #2B2930;border-radius:16px;padding:10px;overflow:hidden">
            <div style="display:flex;gap:6px;align-items:center;min-width:0">
              <div style="flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:19px;background:#2B2930">
                <span style="color:#938F99;flex:none">⌕</span>
                <input value="{{ chooserQuery }}" onInput="{{ setChooserQuery }}" placeholder="Search machines" style="flex:1;min-width:0;background:none;border:0;outline:none;font-size:12.5px" />
              </div>
              <button onClick="{{ openRegexChooser }}" title="Regex builder for this field" style="width:38px;height:38px;flex:none;border-radius:12px;background:#4F378B;color:#EADDFF;font-family:'Roboto Mono',monospace;font-size:12px;font-weight:600" style-hover="filter:brightness(1.15)">.*</button>
            </div>
            <div style="flex:1;min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:2px">
              <sc-for list="{{ chooserRows }}" as="row" hint-placeholder-count="6">
                <button onClick="{{ row.select }}" onContextMenu="{{ row.menu }}" style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:{{ row.bg }};text-align:left;min-width:0" style-hover="background:#2B2930">
                  <span style="width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:8px;background:{{ row.iconBg }}"><span style="width:16px;height:16px;background-image:{{ row.iconCss }};background-size:contain;background-repeat:no-repeat;background-position:center"></span></span>
                  <span style="flex:1;min-width:0">
                    <span style="display:block;font-size:12.5px;font-weight:{{ row.weight }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ row.name }}</span>
                    <span style="display:block;font-size:10.5px;color:#938F99;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ row.sub }}</span>
                  </span>
                  <span style="width:7px;height:7px;flex:none;border-radius:50%;background:{{ row.dot }}"></span>
                </button>
              </sc-for>
            </div>
            <div style="flex:none;padding-top:8px;border-top:1px solid #2B2930;font-size:10.5px;color:#938F99">{{ chooserSummary }}</div>
          </div>
        </sc-if>

        <div style="flex:1;min-width:0;display:flex;flex-direction:column;background:#1D1B20;border:1px solid #2B2930;border-radius:16px;overflow:hidden">
          <sc-if value="{{ showMachineTools }}" hint-placeholder-val="{{ true }}">
            <div style="flex:none;display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid #2B2930;min-width:0">
              <div style="flex:1;min-width:0;display:flex;align-items:center;gap:4px;overflow-x:auto;overflow-y:hidden">
                <sc-for list="{{ machineTools }}" as="mt" hint-placeholder-count="5">
                  <button onClick="{{ mt.select }}" style="flex:none;height:32px;display:flex;align-items:center;gap:7px;padding:0 13px;border-radius:16px;background:{{ mt.bg }};color:{{ mt.fg }};font-size:12px;font-weight:600;white-space:nowrap" style-hover="filter:brightness(1.15)">
                    <span style="width:16px;height:16px;flex:none;background-image:{{ mt.iconCss }};background-size:contain;background-repeat:no-repeat;background-position:center"></span><span>{{ mt.label }}</span>
                  </button>
                </sc-for>
              </div>
              <button onClick="{{ openExport }}" title="Export this view" style="flex:none;width:34px;height:32px;border-radius:16px;color:#CAC4D0;font-size:13px" style-hover="background:#2B2930">⇩</button>
              <button onClick="{{ openAppearanceForPane }}" title="Edit appearance of this pane" style="flex:none;width:34px;height:32px;border-radius:16px;color:#CAC4D0;font-size:13px" style-hover="background:#2B2930">✎</button>
            </div>
          </sc-if>
          <div style="flex:1;min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;padding:14px">{{ paneBody }}</div>
        </div>
      </div>

      <div style="flex:none;height:26px;display:flex;align-items:center;gap:14px;padding:0 20px;background:#1D1B20;border-top:1px solid #2B2930;font-size:11px;color:#938F99;min-width:0">
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ statusText }}</span>
        <div style="flex:1"></div>
        <span style="flex:none">{{ languageLabel }}</span>
        <span style="flex:none">{{ themeLabel }}</span>
        <span style="flex:none;font-family:'Roboto Mono',monospace">7.2.0 r170000</span>
      </div>
    </div>
  </div>

  <sc-if value="{{ contextOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeContext }}" style="position:fixed;inset:0;z-index:35">
      <div style="position:absolute;left:{{ contextX }}px;top:{{ contextY }}px;min-width:220px;padding:6px;background:#211F26;border:1px solid #36343B;border-radius:14px;box-shadow:0 14px 40px #000000bb;display:grid;gap:2px">
        <sc-for list="{{ contextItems }}" as="ci" hint-placeholder-count="4">
          <button onClick="{{ ci.run }}" style="text-align:left;padding:9px 12px;border-radius:9px;color:#E6E0E9;font-size:12.5px" style-hover="background:#36343B;color:#D0BCFF">{{ ci.label }}</button>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ overlayOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#00000099;backdrop-filter:blur(3px)">
      <div style="width:min(760px,calc(100vw - 64px));max-height:calc(100vh - 90px);display:flex;flex-direction:column;background:#211F26;border:1px solid #36343B;border-radius:28px;box-shadow:0 24px 60px #000000aa;animation:mvmIn .2s cubic-bezier(.05,.7,.1,1);overflow:hidden">
        <div style="flex:none;display:flex;align-items:flex-start;gap:12px;padding:22px 24px 12px">
          <div style="flex:1;min-width:0">
            <div style="font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#D0BCFF">{{ overlayEyebrow }}</div>
            <div style="font-size:20px;font-weight:500;margin-top:3px">{{ overlayTitle }}</div>
          </div>
          <button onClick="{{ closeOverlay }}" style="width:34px;height:34px;flex:none;border-radius:17px;color:#CAC4D0" style-hover="background:#36343B">✕</button>
        </div>
        <div style="flex:1;min-height:0;overflow-y:auto;padding:0 24px 22px">{{ overlayBody }}</div>
      </div>
    </div>
  </sc-if>

  <div style="position:fixed;right:20px;bottom:20px;z-index:50;display:flex;flex-direction:column;gap:8px;width:330px">
    <sc-for list="{{ toasts }}" as="t" hint-placeholder-count="0">
      <div style="padding:12px 14px;border-radius:14px;background:#36343B;border-left:3px solid {{ t.accent }};box-shadow:0 8px 26px #000000aa;animation:mvmIn .2s ease">
        <div style="font-size:12.5px;font-weight:600">{{ t.title }}</div>
        <div style="font-size:11.5px;color:#CAC4D0;margin-top:2px">{{ t.detail }}</div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>

      h('div', { style: { display: 'flex', gap: 10, marginBottom: 12 } }, ['left', 'right'].map((side) => h('button', {
        key: side, onClick: () => this.setState({ gate: Object.assign({}, g, { keys: Object.assign({}, g.keys, { [side]: !g.keys[side] }) }) }),
        style: { flex: 1, height: 54, borderRadius: 14, background: g.keys[side] ? T.primaryContainer : T.surfaceHigh, color: g.keys[side] ? T.onPrimaryContainer : T.onSurfaceVar, border: '1px solid ' + (g.keys[side] ? T.primary : T.outlineVar), fontSize: 12.5, fontWeight: 700 }
      }, side === 'left' ? 'Hold key A' : 'Hold key L'))),
      h('input', { type: 'range', min: 0, max: 100, value: g.slide, disabled: !both, onChange: (e) => this.setState({ gate: Object.assign({}, g, { slide: Number(e.target.value) }) }), style: { width: '100%', accentColor: '#FFB4AB' } }),
      h('div', { style: { fontSize: 11.5, color: T.outline, marginTop: 6 } }, both ? 'Slide fully right to arm ' + copy[0].toLowerCase() + '.' : 'Both keys must be held before the slider unlocks.'),
      h('div', { style: { display: 'flex', justifyContent: 'flex-end', gap: 8, marginTop: 16 } },
        this.btn('Emergency exit', () => this.setState({ overlay: null, gate: { kind: '', keys: { left: false, right: false }, slide: 0 } }), 'text'),
        this.btn(copy[0], () => this.commitGate(), 'danger', !armed)));
  }
  commitGate() {
    const kind = this.state.gate.kind;
    const m = this.machine();
    if (kind === 'removeMachine') {
      const machines = this.state.machines.filter((x) => x.id !== m.id);
      this.setState({ machines, selected: machines[0] ? machines[0].id : '' });
      this.record('machine removed', m.name); this.notifyCentre('Machine removed', m.name + ' and its disks were deleted');
    } else if (kind === 'deleteSnapshot') {
      const list = (this.state.snapshots[m.id] || []).filter((x) => x.id !== this.state.selectedSnapshot);
      this.setState({ snapshots: Object.assign({}, this.state.snapshots, { [m.id]: list }) });
      this.updateMachine(m.id, { snapshots: list.length });
      this.record('snapshot deleted', m.name);
    } else if (kind === 'restore') {
      this.setState({ currentSnapshot: Object.assign({}, this.state.currentSnapshot, { [m.id]: this.state.selectedSnapshot }) });
      this.updateMachine(m.id, { state: 'Powered Off' });
      this.record('snapshot restored', m.name + ' · recorded as a new revision');
    } else if (kind === 'discard') {
      this.updateMachine(m.id, { state: 'Powered Off' }); this.record('saved state discarded', m.name);
    } else {
      this.record(kind, m.name);
    }
    this.setState({ overlay: null, gate: { kind: '', keys: { left: false, right: false }, slide: 0 } });
    this.toast('Authorized', this.gateCopy()[0] + ' completed', T.error);
  }

  notificationsBody() {
    const list = this.state.notifications.filter((n) => this.matches(n.title + ' ' + n.detail, this.state.notifyQuery || '', 'notification search'));
    return h('div', null,
      this.searchRow(this.state.notifyQuery || '', (e) => this.setState({ notifyQuery: e.target.value }), 'Search notifications', 'notification search'),
      h('div', { style: { display: 'grid', gap: 6 } },
        list.length ? list.map((n) => h('div', { key: n.id, style: { padding: '11px 13px', borderRadius: 12, background: T.surfaceHigh } },
          h('div', { style: { display: 'flex', gap: 10 } }, h('b', { style: { flex: 1, fontSize: 12.5 } }, n.title), h('span', { style: { fontSize: 11, color: T.outline } }, n.at)),
          h('div', { style: { fontSize: 11.5, color: T.onSurfaceVar, marginTop: 3 } }, n.detail))) :
          h('div', { style: { padding: 12, borderRadius: 12, background: T.surfaceHigh, color: T.outline } }, 'No local notifications.')),
      h('div', { style: { display: 'flex', justifyContent: 'flex-end', gap: 8, marginTop: 14 } },
        this.btn('Clear history', () => { this.setState({ notifications: [] }); this.toast('Cleared', 'Local notification history removed'); }, 'text'),
        this.btn('Close', () => this.setState({ overlay: null }), 'tonal')));
  }
  historyBody() {
    const rows = this.state.history.filter((e) => this.matches(e.action + ' ' + e.detail + ' ' + e.at, this.state.historyQuery || '', 'history search'));
    return h('div', null,
      this.searchRow(this.state.historyQuery || '', (e) => this.setState({ historyQuery: e.target.value }), 'Search revisions by action, detail or time', 'history search'),
      h('div', { style: { display: 'grid', gap: 6 } }, rows.map((e) => h('div', { key: e.id, style: { display: 'flex', alignItems: 'center', gap: 12, padding: '11px 13px', borderRadius: 12, background: T.surfaceHigh } },
        h('span', { style: { flex: 1, minWidth: 0 } }, h('b', { style: { fontSize: 12.5 } }, e.action), h('small', { style: { display: 'block', color: T.outline, fontSize: 11, marginTop: 2 } }, e.detail + ' · ' + e.at)),
        this.btn('Restore', () => { this.record('revision restored', e.action + ' · ' + e.detail); this.toast('Restored', 'Recorded as a new revision'); }, 'tonal')))),
      h('div', { style: { marginTop: 12, fontSize: 11.5, color: T.outline } }, rows.length + ' of ' + this.state.history.length + ' revisions · append-only and Git-backed beside the app data; restoring never destroys the newer revision.'));
  }
  exportBody() {
    const fmts = ['md', 'txt', 'json', 'jsonl', 'yaml', 'toml', 'xml', 'csv', 'tsv', 'html', 'sql', 'ts', 'py', 'go', 'rs', 'proto', 'schema.json'];
    const m = this.machine();
    const rows = this.detailRows();
    const body = {
      md: rows.map(([t, r]) => '## ' + t + '\n' + r.map(([k, v]) => '- ' + k + ': ' + v).join('\n')).join('\n\n'),
      json: JSON.stringify(rows.reduce((acc, [t, r]) => { acc[t] = Object.fromEntries(r); return acc; }, {}), null, 2),
      csv: 'section,key,value\n' + rows.flatMap(([t, r]) => r.map(([k, v]) => [t, k, v].join(','))).join('\n')
    }[this.state.exportFormat] || rows.map(([t, r]) => t + ': ' + r.map(([k, v]) => k + '=' + v).join('; ')).join('\n');
    return h('div', null,
      h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: 12 } }, fmts.map((f) => h('button', {
        key: f, onClick: () => this.setState({ exportFormat: f }),
        style: { height: 30, padding: '0 12px', borderRadius: 15, background: this.state.exportFormat === f ? T.primary : T.surfaceHigh, color: this.state.exportFormat === f ? T.onPrimary : T.onSurfaceVar, fontSize: 11.5, fontWeight: 600, fontFamily: 'Roboto Mono, monospace' }
      }, f))),
      h('pre', { style: { padding: 12, borderRadius: 12, background: '#0F0D13', fontFamily: 'Roboto Mono, monospace', fontSize: 11.5, color: '#C9C3D2', maxHeight: 240, overflow: 'auto', whiteSpace: 'pre-wrap' } }, body),
      h('div', { style: { display: 'flex', justifyContent: 'flex-end', gap: 8, marginTop: 14 } },
        this.btn('Copy', () => { if (navigator.clipboard) navigator.clipboard.writeText(body); this.toast('Copied', 'View copied as ' + this.state.exportFormat); }, 'text'),
        this.btn('Export file', () => { this.setState({ overlay: null }); this.record('view exported', m.name + '.' + this.state.exportFormat); this.toast('Exported', m.name + '.' + this.state.exportFormat); }, 'filled')));
  }
  takeSnapshotBody() {
    const m = this.machine();
    return h('div', null,
      this.field('Snapshot name', this.input({ value: this.state.snapshotName, autoFocus: true, onChange: (e) => this.setState({ snapshotName: e.target.value }) })),
      h('div', { style: { height: 10 } }),
      this.field('Snapshot description', h('textarea', { rows: 4, placeholder: 'What changed before this point?', style: { width: '100%', padding: 12, borderRadius: 12, background: T.surfaceHigh, border: '1px solid ' + T.outlineVar, outline: 'none', fontSize: 12.5, color: T.onSurface, resize: 'vertical' } })),
      h('div', { style: { display: 'flex', justifyContent: 'flex-end', gap: 8, marginTop: 16 } },
        this.btn('Cancel', () => this.setState({ overlay: null }), 'text'),
        this.btn('Take snapshot', () => {
          const name = this.state.snapshotName.trim();
          if (!name) return this.toast('Name required', 'Give the snapshot a name first', T.error);
          const list = this.state.snapshots[m.id] || [];
          const item = { id: 's' + Date.now(), name, at: new Date().toISOString().slice(0, 16).replace('T', ' '), size: '1.0 GB', depth: list.length };
          this.setState({ snapshots: Object.assign({}, this.state.snapshots, { [m.id]: [...list, item] }), currentSnapshot: Object.assign({}, this.state.currentSnapshot, { [m.id]: item.id }), selectedSnapshot: item.id, overlay: null, machineTool: 'snapshots' });
          this.updateMachine(m.id, { snapshots: list.length + 1 });
          this.record('snapshot taken', m.name + ' · ' + name); this.notifyCentre('Snapshot created', m.name + ' · ' + name); this.toast('Snapshot taken', name);
        }, 'filled')));
  }
  editValueBody() {
    return h('div', null,
      h('div', { style: { fontSize: 12, color: T.outline, marginBottom: 10 } }, 'Editing: ' + this.state.regexTarget),
      this.field('Value', this.input({ autoFocus: true, defaultValue: '' })),
      h('div', { style: { display: 'flex', justifyContent: 'flex-end', gap: 8, marginTop: 16 } },
        this.btn('Copy value', () => this.toast('Copied', this.state.regexTarget), 'text'),
        this.btn('Cancel', () => this.setState({ overlay: null }), 'text'),
        this.btn('Save', () => { this.setState({ overlay: null }); this.record('details value edited', this.state.regexTarget); this.toast('Saved', this.state.regexTarget); }, 'filled')));
  }
  preferencesBody() {
    const s = this.state;
    return h('div', null,
      h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 12 } },
        this.field('Application name', this.input({ value: s.brandNameLive === null ? (this.props.brandName || 'Material Virtual Machine') : s.brandNameLive, onChange: (e) => this.setState({ brandNameLive: e.target.value }) })),
        this.field('Wordmark letter', this.input({ maxLength: 2, value: s.brandMarkLive === null ? (this.props.brandMark || 'M') : s.brandMarkLive, onChange: (e) => this.setState({ brandMarkLive: e.target.value }) }))),
      h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 12 } },
        this.field('Language mode', h('div', { style: { display: 'flex', gap: 6 } }, ['English', 'Cantonese', 'Bilingual'].map((l) => h('button', {
          key: l, onClick: () => { this.setState({ language: l }); this.record('language changed', l); },
          style: { flex: 1, height: 38, borderRadius: 19, background: s.language === l ? T.primary : T.surfaceHigh, color: s.language === l ? T.onPrimary : T.onSurfaceVar, fontSize: 11.5, fontWeight: 600 }
        }, l)))),
        this.field('Theme', h('div', { style: { display: 'flex', gap: 6 } }, ['dark', 'light', 'system'].map((l) => h('button', {
          key: l, onClick: () => { this.setState({ theme: l }); this.record('theme changed', l); },
          style: { flex: 1, height: 38, borderRadius: 19, background: s.theme === l ? T.primary : T.surfaceHigh, color: s.theme === l ? T.onPrimary : T.onSurfaceVar, fontSize: 11.5, fontWeight: 600, textTransform: 'capitalize' }
        }, l)))),
        this.field('Density', h('div', { style: { display: 'flex', gap: 6 } }, ['Comfortable', 'Compact'].map((l) => h('button', {
          key: l, onClick: () => this.setState({ density: l }),
          style: { flex: 1, height: 38, borderRadius: 19, background: s.density === l ? T.primary : T.surfaceHigh, color: s.density === l ? T.onPrimary : T.onSurfaceVar, fontSize: 11.5, fontWeight: 600 }
        }, l))))),
      h('div', { style: { marginTop: 14, fontSize: 11.5, color: T.outline } }, 'Everything here persists in VirtualBox extradata so it roams with VBoxSVC. Full preference pages live in ',
        h('a', { href: 'Managers.dc.html' }, 'Managers → Preferences'), '.'),
      h('div', { style: { display: 'flex', justifyContent: 'flex-end', marginTop: 14 } }, this.btn('Done', () => this.setState({ overlay: null }), 'filled')));
  }

  renderVals() {
    const s = this.state;
    const m = this.machine();
    const filtered = s.machines.filter((x) => this.matches(x.name + ' ' + x.group + ' ' + x.os, s.chooserQuery, 'machine chooser search'));
    const groups = [...new Set(filtered.map((x) => x.group))];
    const chooserRows = [];
    groups.forEach((g) => {
      chooserRows.push({ name: g, sub: filtered.filter((x) => x.group === g).length + ' machines', iconCss: 'url("' + I('sf_16px.png') + '")', iconBg: T.surfaceHighest, bg: 'transparent', dot: 'transparent', weight: 700, select: () => {}, menu: (e) => e.preventDefault() });
      filtered.filter((x) => x.group === g).forEach((x) => chooserRows.push({
        name: x.name, sub: x.os, iconCss: 'url("' + I('machine_16px.png') + '")', iconBg: x.id === s.selected ? T.primaryContainer : T.surfaceHighest,
        bg: x.id === s.selected ? T.secondaryContainer : 'transparent', dot: STATE_COLOR[x.state], weight: 500,
        select: () => this.setState({ selected: x.id, selectedSnapshot: (s.snapshots[x.id] || [{}])[0] ? (s.currentSnapshot[x.id] || (s.snapshots[x.id][0] || {}).id) : '' }),
        menu: (e) => { e.preventDefault(); this.setState({ selected: x.id, context: { x: e.clientX, y: e.clientY, machine: x.id } }); }
      }));
    });

    const titles = {
      palette: ['Keyboard route', 'Command palette'], regex: ['Search tool', 'Regex builder'],
      tabs: ['Workspace navigation', 'Tabs, groups and safe closing'], appearance: ['Element appearance', 'Edit appearance'],
      gate: ['Safety gate', this.gateCopy()[0]], notifications: ['Reviewable local notices', 'Notification centre'],
      history: ['Append-only revisions', 'Local history'], export: ['Multi-format export', 'Export current view'],
      preferences: ['Quick preferences', 'Preferences'], takeSnapshot: ['Machine state', 'Take snapshot'], editValue: ['Details element', 'Edit value']
    };
    const bodies = {
      palette: () => this.paletteBody(), regex: () => this.regexBody(), tabs: () => this.tabsBody(), appearance: () => this.appearanceBody(),
      gate: () => this.gateBody(), notifications: () => this.notificationsBody(), history: () => this.historyBody(),
      export: () => this.exportBody(), preferences: () => this.preferencesBody(), takeSnapshot: () => this.takeSnapshotBody(), editValue: () => this.editValueBody()
    };
    const meta = titles[s.overlay] || ['', ''];
    const isMachines = s.tool === 'machines';
    const railLabel = (RAIL.find((r) => r.id === s.tool) || {}).label || 'Home';

    const actions = isMachines ? [
      { label: 'New', iconCss: 'url("icons/vm_new_32px.png")', hint: 'Create a virtual machine', bg: T.primary, fg: T.onPrimary, border: '0', run: () => { window.location.href = 'Wizards.dc.html'; } },
      { label: 'Settings', iconCss: 'url("icons/vm_settings_32px.png")', hint: 'Open machine settings', bg: T.secondaryContainer, fg: T.onSecondaryContainer, border: '0', run: () => { window.location.href = 'VM Settings.dc.html'; } },
      { label: m.state === 'Running' ? 'Pause' : 'Start', iconCss: 'url("icons/vm_start_32px.png")', hint: 'Start or pause the machine', bg: T.secondaryContainer, fg: T.onSecondaryContainer, border: '0', run: () => {
          if (m.state === 'Running') { this.updateMachine(m.id, { state: 'Paused' }); this.record('machine paused', m.name); this.toast('Paused', m.name); }
          else { this.updateMachine(m.id, { state: 'Running', uptime: '0m' }); this.record('machine started', m.name); this.notifyCentre('Machine started', m.name); this.toast('Starting', m.name + ' — opening the runtime window'); }
        } },
      { label: 'Discard', iconCss: 'url("icons/vm_discard_32px.png")', hint: 'Discard the saved state', bg: 'transparent', fg: T.onSurfaceVar, border: '1px solid ' + T.outlineVar, run: () => this.setState({ overlay: 'gate', gate: { kind: 'discard', keys: { left: false, right: false }, slide: 0 } }) }
    ] : [
      { label: 'Refresh', iconCss: 'url("icons/tools_menu_24px.png")', hint: 'Reload this surface', bg: T.secondaryContainer, fg: T.onSecondaryContainer, border: '0', run: () => this.toast('Refreshed', railLabel + ' reloaded') },
      { label: 'Export', iconCss: 'url("icons/media_manager_24px.png")', hint: 'Export this view', bg: 'transparent', fg: T.onSurfaceVar, border: '1px solid ' + T.outlineVar, run: () => this.setState({ overlay: 'export' }) }
    ];

    return {
      brandMark: s.brandMarkLive === null ? (this.props.brandMark ?? 'M') : s.brandMarkLive,
      brandName: s.brandNameLive === null ? (this.props.brandName ?? 'Material Virtual Machine') : s.brandNameLive,
      eyebrow: isMachines ? 'Machine tools' : 'Global tool',
      pageTitle: isMachines ? (m ? m.name : 'No machine selected') : railLabel,
      statusText: isMachines && m ? m.name + ' · ' + m.state + ' · uptime ' + m.uptime : railLabel + ' · read-only inventory',
      languageLabel: s.language, themeLabel: s.theme === 'dark' ? 'Dark' : s.theme === 'light' ? 'Light' : 'System',
      hasUnread: s.notifications.some((n) => n.unread),

      railItems: RAIL.map((r) => ({
        label: r.label, hint: r.hint, iconCss: 'url("' + I(r.icon) + '")',
        pill: r.id === s.tool ? T.secondaryContainer : 'transparent',
        fg: r.id === s.tool ? T.onSurface : T.onSurfaceVar, select: () => this.openTool(r.id)
      })),
      openTabs: s.tabs.map((t) => ({
        label: t.label, title: t.label + ' · ' + t.group + (t.pinned ? ' · pinned' : ''),
        bg: t.id === s.tool ? T.surfaceHighest : 'transparent', fg: t.id === s.tool ? T.onSurface : T.outline,
        dot: t.pinned ? T.primary : T.outlineVar,
        select: () => this.setState({ tool: t.id }),
        close: (e) => { e.stopPropagation(); this.closeTab(t.id); },
        menu: (e) => { e.preventDefault(); this.setState({ overlay: 'tabs' }); }
      })),
      newTab: () => this.setState({ overlay: 'palette', paletteQuery: '' }),
      openTabManager: () => this.setState({ overlay: 'tabs' }),

      showChooser: isMachines, showMachineTools: isMachines,
      machineTools: MTOOLS.map((t) => ({
        label: t.label, iconCss: 'url("' + I(t.icon) + '")', bg: t.id === s.machineTool ? T.primary : 'transparent',
        fg: t.id === s.machineTool ? T.onPrimary : T.onSurfaceVar, select: () => this.setState({ machineTool: t.id })
      })),
      chooserQuery: s.chooserQuery,
      setChooserQuery: (e) => this.setState({ chooserQuery: e.target.value }),
      openRegexChooser: () => this.setState({ overlay: 'regex', regexTarget: 'machine chooser search' }),
      chooserRows, chooserSummary: filtered.length + ' of ' + s.machines.length + ' machines · ' + groups.length + ' groups',

      pageActions: actions,
      paneBody: this.paneBody(),

      openPalette: () => this.setState({ overlay: 'palette', paletteQuery: '' }),
      openNotifications: () => this.setState({ overlay: 'notifications', notifications: s.notifications.map((n) => Object.assign({}, n, { unread: false })) }),
      openPreferences: () => this.setState({ overlay: 'preferences' }),
      openExport: () => this.setState({ overlay: 'export' }),
      openAppearanceForPane: () => this.setState({ overlay: 'appearance', appearance: Object.assign({}, s.appearance, { target: isMachines ? 'Machine tools pane · ' + s.machineTool : railLabel + ' pane' }) }),
      winMinimize: () => this.toast('Minimize', 'Window minimized to the taskbar'),
      winMaximize: () => this.toast('Maximize', 'Window toggled between maximized and restored'),
      winClose: () => this.toast('Close', 'Closing asks to save open work first'),

      contextOpen: Boolean(s.context), contextX: s.context ? Math.min(s.context.x, window.innerWidth - 240) : 0,
      contextY: s.context ? Math.min(s.context.y, window.innerHeight - 230) : 0,
      closeContext: () => this.setState({ context: null }),
      contextItems: s.context ? [
        { label: 'Settings…', run: () => { window.location.href = 'VM Settings.dc.html'; } },
        { label: 'Start', run: () => { this.updateMachine(s.context.machine, { state: 'Running' }); this.setState({ context: null }); this.toast('Starting', 'Machine session requested'); } },
        { label: 'Take snapshot…', run: () => this.setState({ context: null, overlay: 'takeSnapshot', snapshotName: 'Snapshot ' + ((s.snapshots[s.context.machine] || []).length + 1) }) },
        { label: 'Edit appearance…', run: () => this.setState({ context: null, overlay: 'appearance', appearance: Object.assign({}, s.appearance, { target: 'Chooser item · ' + s.context.machine }) }) },
        { label: 'Remove…', run: () => this.setState({ context: null, overlay: 'gate', gate: { kind: 'removeMachine', keys: { left: false, right: false }, slide: 0 } }) }
      ] : [],

      overlayOpen: Boolean(s.overlay), overlayEyebrow: meta[0], overlayTitle: meta[1],
      overlayBody: s.overlay ? bodies[s.overlay]() : null,
      closeOverlay: () => this.setState({ overlay: null }),
      toasts: s.toasts
    };
  }
}
</script>
</body>
</html>
