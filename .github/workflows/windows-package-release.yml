name: Windows package and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-package-release:
    runs-on: windows-2022
    env:
      VBOX_CI_QT_VERSION: 6.8.3
      VBOX_CI_WDK_VERSION: 10.0.22621
      VBOX_CI_WLH_VERSION: 7.1.0
      VBOX_SIGNING_MODE: ""
      VBOX_WITHOUT_HARDENING: "1"
      VBOX_OSE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore encrypted dependency release
        id: dependency_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
          DEPENDENCY_CACHE_PASSPHRASE: ${{ secrets.DEPENDENCY_CACHE_PASSPHRASE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = "ci-deps-windows-qt$env:VBOX_CI_QT_VERSION-wdk$env:VBOX_CI_WDK_VERSION-wlh$env:VBOX_CI_WLH_VERSION-"
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tag = @($releases | Where-Object { $_.tagName.StartsWith($prefix) } | Select-Object -First 1).tagName
          if (-not $tag) {
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'cache_hit=false' -Encoding utf8NoBOM
            exit 0
          }
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) { throw '7-Zip is required to restore the encrypted dependency release.' }
          $dependencyRoot = Join-Path $env:RUNNER_TEMP 'virtualbox-dependencies'
          New-Item -ItemType Directory -Force $dependencyRoot | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern 'virtualbox-dependencies.7z.*' --dir $dependencyRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $sevenZip x (Join-Path $dependencyRoot 'virtualbox-dependencies.7z.001') "-p$env:DEPENDENCY_CACHE_PASSPHRASE" "-o$dependencyRoot" -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $dependencyRoot "virtualbox-qt\$env:VBOX_CI_QT_VERSION\msvc2022_64\bin\qmake.exe"))) {
            throw "Dependency release $tag is missing the expected Qt payload."
          }
          if (-not (Test-Path (Join-Path $dependencyRoot 'tools\win.x86\win_flex_bison\v3.7.4\win_bison.exe'))) {
            Write-Host "Dependency release $tag predates the flex/bison cache; the cache will be refreshed after bootstrap."
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'cache_hit=false' -Encoding utf8NoBOM
            exit 0
          }
          $cachedNsisRoot = Join-Path $dependencyRoot 'tools\win.x86\nsis\v3.10-log-r1'
          $nsisCacheFiles = @(
            (Join-Path $cachedNsisRoot 'makensis.exe'),
            (Join-Path $cachedNsisRoot 'Include\nsProcess.nsh'),
            (Join-Path $cachedNsisRoot 'Plugins\x86-unicode\nsProcess.dll'),
            (Join-Path $cachedNsisRoot 'Plugins\x86-unicode\AccessControl.dll'),
            (Join-Path $cachedNsisRoot 'VirtualBox-NSIS_CONFIG_LOG.txt')
          )
          if (@($nsisCacheFiles | Where-Object { -not (Test-Path $_) }).Count -gt 0) {
            Write-Host "Dependency release $tag predates the NSIS cache; the cache will be refreshed after bootstrap."
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'cache_hit=false' -Encoding utf8NoBOM
            exit 0
          }
          $wdk71Marker = Get-ChildItem (Join-Path $dependencyRoot 'winddk71') -Recurse -Filter 'rxce.lib' -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\lib\\wlh\\amd64\\rxce\.lib$' } | Select-Object -First 1
          if (-not $wdk71Marker) {
            Write-Host "Dependency release $tag predates the WDK 7.1 compatibility libraries; the cache will be refreshed after bootstrap."
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'cache_hit=false' -Encoding utf8NoBOM
            exit 0
          }
          New-Item -ItemType Directory -Force '.\tools\win.x86\win_flex_bison' | Out-Null
          Copy-Item (Join-Path $dependencyRoot 'tools\win.x86\win_flex_bison\v3.7.4') '.\tools\win.x86\win_flex_bison' -Recurse -Force
          New-Item -ItemType Directory -Force '.\tools\win.x86\nsis' | Out-Null
          Copy-Item (Join-Path $dependencyRoot 'tools\win.x86\nsis\v3.10-log-r1') '.\tools\win.x86\nsis' -Recurse -Force
          New-Item -ItemType File -Force (Join-Path $env:RUNNER_TEMP 'virtualbox-dependency-release-hit') | Out-Null
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'cache_hit=true' -Encoding utf8NoBOM

      - name: Restore safe build dependency cache
        id: dependency-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\virtualbox-dependencies
          key: virtualbox-windows-deps-qt${{ env.VBOX_CI_QT_VERSION }}-wdk${{ env.VBOX_CI_WDK_VERSION }}-wlh${{ env.VBOX_CI_WLH_VERSION }}-${{ hashFiles('Config.kmk', 'kBuild/kBuild/Config.kmk') }}

      - name: Bootstrap Windows packaging dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dependencyRoot = Join-Path $env:RUNNER_TEMP 'virtualbox-dependencies'
          $qtRoot = Join-Path $dependencyRoot 'virtualbox-qt'
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) { throw '7-Zip is required to bootstrap the Windows packaging toolchain.' }
          $cachedWix = Join-Path $dependencyRoot 'tools\win.x86\wix'
          if (Test-Path $cachedWix) {
            New-Item -ItemType Directory -Force '.\tools\win.x86' | Out-Null
            Copy-Item $cachedWix '.\tools\win.x86\wix' -Recurse -Force
          }

          # The hosted image supplies Visual Studio Build Tools, Python, and .NET.
          # Install the remaining package inputs from their canonical publishers.
          $sdkSetup = Join-Path $env:RUNNER_TEMP 'winsdksetup.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://download.microsoft.com/download/3/b/d/3bd97f81-3f5b-4922-b86d-dc5145cd6bfe/windowssdk/winsdksetup.exe' -OutFile $sdkSetup
          if ((Get-FileHash $sdkSetup -Algorithm SHA256).Hash -ne '3F73F59566B0CF3EDDDDAF61AD72BB0C6E4588A5D9E004ABF68115B752EBBBD8') { throw 'Windows SDK bootstrap hash did not match the canonical manifest.' }
          $sdkInstall = Start-Process -FilePath $sdkSetup -ArgumentList '/quiet','/norestart' -Wait -PassThru -WindowStyle Hidden
          if ($sdkInstall.ExitCode -ne 0) { throw "Windows SDK installation failed with exit code $($sdkInstall.ExitCode)." }

          $wdkSetup = Join-Path $env:RUNNER_TEMP 'wdksetup.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://download.microsoft.com/download/7/b/f/7bfc8dbe-00cb-47de-b856-70e696ef4f46/wdk/wdksetup.exe' -OutFile $wdkSetup
          if ((Get-FileHash $wdkSetup -Algorithm SHA256).Hash -ne 'A891543C0EAF610757EE7852F515C5CE89D0202F22A15DFA31C4D49F2BAFDF27') { throw 'Windows Driver Kit bootstrap hash did not match the canonical manifest.' }
          $wdkInstall = Start-Process -FilePath $wdkSetup -ArgumentList '/quiet','/norestart' -Wait -PassThru -WindowStyle Hidden
          if ($wdkInstall.ExitCode -ne 0) { throw "Windows Driver Kit installation failed with exit code $($wdkInstall.ExitCode)." }
          if (-not (Test-Path 'C:\Program Files (x86)\Windows Kits\10\Include')) {
            throw 'Windows Driver Kit installation did not create the expected Windows Kits include directory.'
          }
          $windowsSdkRoot = 'C:\Program Files (x86)\Windows Kits\10'
          $windowsSdkRoot = (cmd /c "for %I in (`"$windowsSdkRoot`") do @echo %~sI").Trim() -replace '\\','/'
          "VBOX_CI_WINDOWS_SDK_ROOT=$windowsSdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $wdk71CacheRoot = Join-Path $dependencyRoot 'winddk71'
          $wdk71Marker = Get-ChildItem $wdk71CacheRoot -Recurse -Filter 'rxce.lib' -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\lib\\wlh\\amd64\\rxce\.lib$' } | Select-Object -First 1
          if (-not $wdk71Marker) {
            $wdk71Iso = Join-Path $env:RUNNER_TEMP 'GRMWDK_EN_7600_1.ISO'
            Invoke-WebRequest -UseBasicParsing -Uri 'https://download.microsoft.com/download/4/a/2/4a25c7d5-efbe-4182-b6a9-ae6850409a78/GRMWDK_EN_7600_1.ISO' -OutFile $wdk71Iso
            if ((Get-FileHash $wdk71Iso -Algorithm SHA256).Hash -ne '5EDC723B50EA28A070CAD361DD0927DF402B7A861A036BBCF11D27EBBA77657D') { throw 'WDK 7.1 ISO bootstrap hash did not match the canonical manifest.' }
            $wdk71Packages = Join-Path $env:RUNNER_TEMP 'wdk71-packages'
            New-Item -ItemType Directory -Force $wdk71Packages | Out-Null
            & $sevenZip x $wdk71Iso 'WDK\headers.msi' 'WDK\headers_cab001.cab' 'WDK\vistalibs_x64fre.msi' 'WDK\vistalibs_x64fre_cab001.cab' 'WDK\wnetlibs_x64fre.msi' 'WDK\wnetlibs_x64fre_cab001.cab' "-o$wdk71Packages" '-y'
            if ($LASTEXITCODE -ne 0) { throw "WDK 7.1 package extraction failed with exit code $LASTEXITCODE." }
            New-Item -ItemType Directory -Force $wdk71CacheRoot | Out-Null
            foreach ($packageName in @('headers.msi','vistalibs_x64fre.msi','wnetlibs_x64fre.msi')) {
              $packagePath = Join-Path $wdk71Packages "WDK\$packageName"
              $install = Start-Process -FilePath 'msiexec.exe' -ArgumentList @('/a', $packagePath, "TARGETDIR=$wdk71CacheRoot", '/qn', '/norestart') -Wait -PassThru -WindowStyle Hidden
              if ($install.ExitCode -ne 0) { throw "WDK 7.1 package $packageName extraction failed with exit code $($install.ExitCode)." }
            }
            $wdk71Marker = Get-ChildItem $wdk71CacheRoot -Recurse -Filter 'rxce.lib' -File -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\lib\\wlh\\amd64\\rxce\.lib$' } | Select-Object -First 1
          }
          if (-not $wdk71Marker) { throw 'WDK 7.1 extraction did not provide lib\wlh\amd64\rxce.lib.' }
          $wdk71Root = $wdk71Marker.Directory.Parent.Parent.Parent.FullName
          "PATH_SDK_WINDDK71=$wdk71Root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:PATH_SDK_WINDDK71 = $wdk71Root
          $vcpkgCommand = Get-Command vcpkg.exe -ErrorAction SilentlyContinue
          if (-not $vcpkgCommand) { throw 'vcpkg.exe is required by the VirtualBox configure step.' }
          $vcpkgRoot = Split-Path $vcpkgCommand.Path -Parent
          "VBOX_CI_VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $nasmVersion = '2.16.01'
          $nasmZip = Join-Path $env:RUNNER_TEMP "nasm-$nasmVersion-win64.zip"
          $nasmRoot = Join-Path $env:RUNNER_TEMP "nasm-$nasmVersion"
          Invoke-WebRequest -UseBasicParsing -Uri "https://www.nasm.us/pub/nasm/releasebuilds/$nasmVersion/win64/nasm-$nasmVersion-win64.zip" -OutFile $nasmZip
          Expand-Archive -LiteralPath $nasmZip -DestinationPath $nasmRoot -Force
          $nasm = Get-ChildItem $nasmRoot -Recurse -Filter nasm.exe | Select-Object -First 1
          if (-not $nasm) { throw 'NASM bootstrap did not provide nasm.exe.' }
          $nasmDirectory = (cmd /c "for %I in (`"$($nasm.DirectoryName)`") do @echo %~sI").Trim() -replace '\\','/'
          "PATH=$nasmDirectory;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:PATH = "$nasmDirectory;$env:PATH"
          if (-not (Get-Command nasm.exe -ErrorAction SilentlyContinue)) { throw 'NASM bootstrap path was not available to the current packaging step.' }
          $zipCommand = Get-Command zip.exe -ErrorAction SilentlyContinue
          if (-not $zipCommand) {
            $zipCandidates = @(
              (Join-Path $env:ProgramFiles 'Git\usr\bin\zip.exe'),
              (Join-Path ${env:ProgramFiles(x86)} 'Git\usr\bin\zip.exe')
            ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
            $zipCandidate = $zipCandidates | Select-Object -First 1
            if ($zipCandidate) {
              $zipCommand = Get-Item -LiteralPath $zipCandidate
              $zipDirectory = $zipCommand.DirectoryName
              "PATH=$zipDirectory;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          if (-not $zipCommand) {
            $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
            if (-not (Test-Path -LiteralPath $sevenZip)) { throw '7-Zip is required to unpack the verified Info-ZIP package.' }
            $zipArchive = Join-Path $env:RUNNER_TEMP 'miktex-zip-bin-x64.tar.lzma'
            Invoke-WebRequest -UseBasicParsing -Uri 'https://ftp.fau.de/ctan/systems/win32/miktex/tm/packages/miktex-zip-bin-x64.tar.lzma' -OutFile $zipArchive
            $zipArchiveInfo = Get-Item -LiteralPath $zipArchive
            if ($zipArchiveInfo.Length -lt 100000) { throw "Info-ZIP bootstrap archive is unexpectedly small: $($zipArchiveInfo.Length) bytes." }
            $zipArchiveHash = (Get-FileHash -LiteralPath $zipArchive -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "Info-ZIP bootstrap archive SHA-256=$zipArchiveHash ($($zipArchiveInfo.Length) bytes)."
            $zipInstall = Join-Path $env:RUNNER_TEMP 'miktex-zip-bin-x64'
            New-Item -ItemType Directory -Force $zipInstall | Out-Null
            $zipOutput = '-o' + $zipInstall
            & $sevenZip x $zipArchive $zipOutput '-y'
            if ($LASTEXITCODE -ne 0) { throw "Info-ZIP LZMA extraction failed with exit code $LASTEXITCODE." }
            $tarArchive = Get-ChildItem -LiteralPath $zipInstall -Filter '*.tar' -File | Select-Object -First 1
            if (-not $tarArchive) { throw 'Info-ZIP bootstrap did not produce its tar payload.' }
            & $sevenZip t $tarArchive.FullName
            if ($LASTEXITCODE -ne 0) { throw "Info-ZIP tar payload validation failed with exit code $LASTEXITCODE." }
            & $sevenZip x $tarArchive.FullName $zipOutput '-y'
            if ($LASTEXITCODE -ne 0) { throw "Info-ZIP tar payload extraction failed with exit code $LASTEXITCODE." }
            $zipBinary = Get-ChildItem -LiteralPath $zipInstall -Recurse -Filter miktex-zip.exe -File | Select-Object -First 1
            if ($zipBinary) {
              $zipHash = (Get-FileHash -LiteralPath $zipBinary.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($zipHash -ne 'f52e7f6a0a01a0e70443dfecbbe9e3d42d0bd80dd295ec6acc234b0971e0a3fd') { throw "Info-ZIP payload SHA-256 mismatch: got $zipHash." }
              $zipPath = Join-Path $zipInstall 'zip.exe'
              Copy-Item -LiteralPath $zipBinary.FullName -Destination $zipPath -Force
              $zipCommand = Get-Item -LiteralPath $zipPath
              "PATH=$($zipCommand.DirectoryName);$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          if (-not $zipCommand) { throw 'zip.exe is required for the Validation Kit package and was not available from the runner or Git for Windows.' }
          Write-Host "Using zip.exe from $($zipCommand.FullName)."
          $flexTarget = Join-Path $PWD 'tools\win.x86\win_flex_bison\v3.7.4'
          if (-not (Test-Path (Join-Path $flexTarget 'win_bison.exe'))) {
            $flexVersion = '2.5.24'
            $flexZip = Join-Path $env:RUNNER_TEMP "win_flex_bison-$flexVersion.zip"
            $flexRoot = Join-Path $env:RUNNER_TEMP "win_flex_bison-$flexVersion"
            Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/lexxmark/winflexbison/releases/download/v$flexVersion/win_flex_bison-$flexVersion.zip" -OutFile $flexZip
            if ((Get-FileHash $flexZip -Algorithm SHA256).Hash -ne '39C6086CE211D5415500ACC5ED2D8939861CA1696AEE48909C7F6DAF5122B505') { throw 'WinFlexBison bootstrap hash did not match the canonical release asset.' }
            Expand-Archive -LiteralPath $flexZip -DestinationPath $flexRoot -Force
            $flexExecutable = Get-ChildItem $flexRoot -Recurse -Filter win_bison.exe -File | Select-Object -First 1
            if (-not $flexExecutable -or -not (Test-Path (Join-Path $flexExecutable.DirectoryName 'win_flex.exe'))) { throw 'WinFlexBison bootstrap did not provide win_bison.exe and win_flex.exe.' }
            New-Item -ItemType Directory -Force $flexTarget | Out-Null
            Copy-Item (Join-Path $flexExecutable.DirectoryName '*') $flexTarget -Recurse -Force
          } else {
            Write-Host 'Restored WinFlexBison from the encrypted dependency release.'
          }
          if (-not (Test-Path (Join-Path $flexTarget 'win_bison.exe'))) { throw 'WinFlexBison was not materialized under tools\win.x86\win_flex_bison\v3.7.4.' }
          $cachedFlex = Join-Path $dependencyRoot 'tools\win.x86\win_flex_bison\v3.7.4'
          New-Item -ItemType Directory -Force (Split-Path $cachedFlex) | Out-Null
          Copy-Item $flexTarget $cachedFlex -Recurse -Force
          if (-not (Test-Path '.\tools\win.x86\wix\v4.0.5\tools\net472\x86\wix.exe')) {
            dotnet tool install --tool-path '.\tools\win.x86\wix\v4.0.5\tools\net472\x86' wix --version 4.0.5
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path '.\tools\win.x86\wix\v4.0.5\tools\net472\x86\wix.exe')) {
            throw 'The official WiX 4.0.5 tool package did not materialize the tree-compatible executable path.'
          }

          if (-not (Test-Path (Join-Path $qtRoot "$env:VBOX_CI_QT_VERSION\msvc2022_64\bin\qmake.exe"))) {
            python -m pip install --disable-pip-version-check --user aqtinstall
            python -m aqt install-qt windows desktop $env:VBOX_CI_QT_VERSION win64_msvc2022_64 --outputdir $qtRoot
          }
          python -m pip install --disable-pip-version-check --user 'mako==1.3.10'
          python -c "import mako; assert tuple(int(x) for x in mako.__version__.split('.')[:2]) >= (0, 8); print('Mako', mako.__version__)"
          $qt = Get-ChildItem $qtRoot -Directory | Select-Object -First 1
          if (-not $qt) { throw 'Qt installation did not create a version directory.' }
          $qt = Get-ChildItem $qt.FullName -Directory | Select-Object -First 1
          if (-not $qt -or -not (Test-Path (Join-Path $qt.FullName 'bin\qmake.exe'))) {
            throw 'Qt installation is missing qmake.exe.'
          }
          "VBOX_CI_QT_ROOT=$($qt.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure the prerequisite Windows build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Get-Command python.exe -ErrorAction Stop
          $pythonRoot = (Split-Path $python.Source -Parent) -replace '\\','/'
          .\configure.ps1 --disable-hardening --disable-python_c_api --disable-win-ddk --disable-win-msi --disable-win-wix --with-kbuild-path="$PWD\kBuild\kBuild" --with-qt-path="$env:VBOX_CI_QT_ROOT" --with-sdk10="$env:VBOX_CI_WINDOWS_SDK_ROOT" --with-win-vcpkg-root="$env:VBOX_CI_VCPKG_ROOT" --with-python-path="$pythonRoot"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path .\env.bat)) { throw 'configure.py did not generate env.bat.' }

      - name: Build the custom NSIS log packaging tool
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tools\prepare-nsis.ps1 -EnvironmentFile .\env.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish encrypted dependency release when missing
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
          DEPENDENCY_CACHE_PASSPHRASE: ${{ secrets.DEPENDENCY_CACHE_PASSPHRASE }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path (Join-Path $env:RUNNER_TEMP 'virtualbox-dependency-release-hit')) {
            Write-Host 'Validated encrypted dependency release was restored; skipping publication.'
            exit 0
          }
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) { throw '7-Zip is required to publish the encrypted dependency release.' }
          $dependencyRoot = Join-Path $env:RUNNER_TEMP 'virtualbox-dependencies'
          $cachedWix = Join-Path $dependencyRoot 'tools\win.x86\wix'
          New-Item -ItemType Directory -Force (Split-Path $cachedWix) | Out-Null
          Copy-Item '.\tools\win.x86\wix' $cachedWix -Recurse -Force
          $cachedFlex = Join-Path $dependencyRoot 'tools\win.x86\win_flex_bison'
          New-Item -ItemType Directory -Force (Split-Path $cachedFlex) | Out-Null
          Copy-Item '.\tools\win.x86\win_flex_bison\*' $cachedFlex -Recurse -Force
          $cachedNsis = Join-Path $dependencyRoot 'tools\win.x86\nsis'
          New-Item -ItemType Directory -Force (Split-Path $cachedNsis) | Out-Null
          Copy-Item '.\tools\win.x86\nsis\*' $cachedNsis -Recurse -Force
          $cachedNsisRoot = Join-Path $cachedNsis 'v3.10-log-r1'
          $requiredNsisFiles = @(
            (Join-Path $cachedNsisRoot 'makensis.exe'),
            (Join-Path $cachedNsisRoot 'Include\nsProcess.nsh'),
            (Join-Path $cachedNsisRoot 'Plugins\x86-unicode\nsProcess.dll'),
            (Join-Path $cachedNsisRoot 'Plugins\x86-unicode\AccessControl.dll'),
            (Join-Path $cachedNsisRoot 'VirtualBox-NSIS_CONFIG_LOG.txt')
          )
          if (@($requiredNsisFiles | Where-Object { -not (Test-Path $_) }).Count -gt 0) { throw 'NSIS or its pinned VirtualBox installer plugins are missing from the dependency cache.' }
          $cachedWdk71 = Join-Path $dependencyRoot 'winddk71'
          $wdk71Marker = Get-ChildItem $cachedWdk71 -Recurse -Filter 'rxce.lib' -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\lib\\wlh\\amd64\\rxce\.lib$' } | Select-Object -First 1
          if (-not $wdk71Marker) { throw 'WDK 7.1 compatibility libraries are missing from the dependency cache.' }
          $archive = Join-Path $env:RUNNER_TEMP 'virtualbox-dependencies.7z'
          Push-Location $dependencyRoot
          try {
            & $sevenZip a $archive virtualbox-qt 'tools\win.x86\wix' 'tools\win.x86\win_flex_bison' 'tools\win.x86\nsis' winddk71 "-p$env:DEPENDENCY_CACHE_PASSPHRASE" -mhe=on -t7z -v1536m
          } finally {
            Pop-Location
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $parts = Get-ChildItem "$archive.*" -File | Sort-Object Name
          if (-not $parts) { throw 'Encrypted dependency archive did not produce any upload parts.' }
          $tag = "ci-deps-windows-qt$env:VBOX_CI_QT_VERSION-wdk$env:VBOX_CI_WDK_VERSION-wlh$env:VBOX_CI_WLH_VERSION-$env:GITHUB_RUN_ID"
          $notes = "Encrypted Windows dependency cache for Qt $env:VBOX_CI_QT_VERSION, WDK $env:VBOX_CI_WDK_VERSION, WDK 7.1 compatibility libraries, WinFlexBison, WiX, and NSIS 3.10. Parts are limited to 1.5 GiB."
          gh release create $tag $parts.FullName --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Windows dependency cache $tag" --notes $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and package the Windows installer
        shell: pwsh
        run: |
          $revisionMatch = Select-String configure.py -Pattern '\$Id: configure.py (\d+)'
          if (-not $revisionMatch) { throw 'configure.py does not expose a numeric source revision for the Git mirror build.' }
          $revision = $revisionMatch.Matches[0].Groups[1].Value
          $revisionFile = Join-Path $PWD 'out\win.amd64\release\revision.kmk'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $revisionFile) | Out-Null
          Set-Content -LiteralPath $revisionFile -Value "export VBOX_SVN_REV=$revision" -Encoding ascii
          & cmd.exe /d /c "call `"$PWD\env.bat`" && kmk crypto-headers"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cmd.exe /d /c "call `"$PWD\env.bat`" && kmk VBOX_SVN_REV=$revision SDK_WINSDK10_MAX_VERSION=10.0.22621.0 VBOX_WINDDK_GST_W7=WINSDK10-KM VBOX_WINDDK_GST_W8=WINSDK10-KM VBOX_WINDDK_GST_WLH=WINDDK71WLH VBOX_WINDDK_GST_W2K3=WINSDK10-KM VBOX_WINDDK_GST_WXP=WINSDK10-KM VBOX_WINDDK_GST_W2K=WINSDK10-KM VBOX_WINDDK_GST_NT4=WINSDK10-KM VBOX_USE_RTISOMAKER=1 packing"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build unsigned Squirrel full installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = Resolve-Path 'out\win.amd64\release\bin'
          if (-not (Test-Path (Join-Path $payload 'VirtualBox.exe'))) {
            throw 'The packaged Windows payload is missing VirtualBox.exe.'
          }
          $nugetCommand = Get-Command nuget.exe -ErrorAction SilentlyContinue
          if ($nugetCommand) {
            $nugetPath = $nugetCommand.Path
          } else {
            $nugetPath = Join-Path $env:RUNNER_TEMP 'nuget.exe'
            Invoke-WebRequest 'https://dist.nuget.org/win-x86-commandline/v6.11.1/nuget.exe' -OutFile $nugetPath
          }
          $squirrelRoot = Join-Path $env:RUNNER_TEMP 'squirrel-tools'
          & $nugetPath install squirrel.windows -Version 1.9.1 -OutputDirectory $squirrelRoot -ExcludeVersion -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $squirrel = Join-Path $squirrelRoot 'squirrel.windows\tools\Squirrel.exe'
          if (-not (Test-Path $squirrel)) { throw 'NuGet did not provide Squirrel.exe.' }
          $major = (Select-String Version.kmk -Pattern '^VBOX_VERSION_MAJOR\s*=\s*(\d+)' | ForEach-Object { $_.Matches[0].Groups[1].Value })
          $minor = (Select-String Version.kmk -Pattern '^VBOX_VERSION_MINOR\s*=\s*(\d+)' | ForEach-Object { $_.Matches[0].Groups[1].Value })
          $version = "$major.$minor.$env:GITHUB_RUN_NUMBER"
          $stage = Join-Path $env:RUNNER_TEMP 'squirrel-stage'
          $releaseDir = Join-Path $env:RUNNER_TEMP 'squirrel-release'
          New-Item -ItemType Directory -Force (Join-Path $stage 'lib\net45'),$releaseDir | Out-Null
          Copy-Item (Join-Path $payload '*') (Join-Path $stage 'lib\net45') -Recurse -Force
          $nuspec = @"
          <?xml version="1.0"?>
          <package>
            <metadata>
              <id>VirtualBox</id>
              <version>$version</version>
              <authors>Oracle</authors>
              <description>Unsigned VirtualBox Windows package.</description>
            </metadata>
            <files><file src="lib\net45\**\*" target="lib\net45" /></files>
          </package>
          "@
          $nuspecPath = Join-Path $stage 'VirtualBox.nuspec'
          Set-Content -LiteralPath $nuspecPath -Value $nuspec -Encoding utf8
          Push-Location $stage
          try {
            & $nugetPath pack $nuspecPath -NoPackageAnalysis -NonInteractive
          } finally {
            Pop-Location
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = Join-Path $stage "VirtualBox.$version.nupkg"
          if (-not (Test-Path $package)) { throw 'NuGet did not produce the Squirrel input package.' }
          & $squirrel --releasify $package --releaseDir $releaseDir --no-msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify unsigned package inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = Join-Path $env:RUNNER_TEMP 'squirrel-release'
          $setup = Join-Path $releaseDir 'Setup.exe'
          $releases = Join-Path $releaseDir 'RELEASES'
          $fullPackage = Get-ChildItem $releaseDir -Filter '*-full.nupkg' -File | Select-Object -First 1
          if (-not (Test-Path $setup) -or -not (Test-Path $releases) -or -not $fullPackage) {
            throw 'Squirrel did not produce Setup.exe, RELEASES, and a full .nupkg.'
          }
          $packages = Get-ChildItem $releaseDir -File
          $packages | ForEach-Object {
            if ($_.Extension -eq '.exe') {
              $signature = Get-AuthenticodeSignature $_.FullName
              if ($signature.Status -ne 'NotSigned') { throw "Expected unsigned asset: $($_.FullName) ($($signature.Status))" }
            }
            Get-FileHash $_.FullName -Algorithm SHA256 | Format-List | Out-String | Add-Content "$env:RUNNER_TEMP\package-hashes.txt"
          }
          $packages.FullName | Set-Content "$env:RUNNER_TEMP\package-files.txt"

      - name: Collect build evidence
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\evidence" | Out-Null
          Copy-Item configure.log,AutoConfig.kmk -Destination "$env:RUNNER_TEMP\evidence" -ErrorAction SilentlyContinue
          Copy-Item "$env:LOCALAPPDATA\VirtualBox\build-tools\nsis-3.10-source\scons.log" -Destination "$env:RUNNER_TEMP\evidence" -ErrorAction SilentlyContinue
          Copy-Item "$env:RUNNER_TEMP\package-hashes.txt","$env:RUNNER_TEMP\package-files.txt" -Destination "$env:RUNNER_TEMP\evidence" -ErrorAction SilentlyContinue
          Copy-Item "$env:RUNNER_TEMP\squirrel-release\*" -Destination "$env:RUNNER_TEMP\evidence" -ErrorAction SilentlyContinue

      - name: Upload build evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}\evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Compose release content
        if: ${{ success() }}
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
          DIM_SUM_CATALOG_URL: https://raw.githubusercontent.com/Ding-Ding-Projects/dim-sum-photos/main/catalog/index.json
          DIM_SUM_PHOTO_REPOSITORY: Ding-Ding-Projects/dim-sum-photos
          DIM_SUM_CANDIDATE_LIMIT: "8"
        run: |
          # Produces the release-notes fragments that the publish step consumes. Every
          # failure in here is reported in the fragment itself; none of it may block or
          # fail the release, which is why the step is continue-on-error and why nothing
          # below rethrows.
          $ErrorActionPreference = 'Continue'
          $lineCountPath = Join-Path $env:RUNNER_TEMP 'release-line-count.md'
          $dimSumNotePath = Join-Path $env:RUNNER_TEMP 'release-dim-sum.md'
          $dimSumAssetPath = Join-Path $env:RUNNER_TEMP 'release-dim-sum-asset.txt'
          $dimSumTitlePath = Join-Path $env:RUNNER_TEMP 'release-dim-sum-title.txt'
          Set-Content -LiteralPath $dimSumAssetPath -Value '' -Encoding utf8
          Set-Content -LiteralPath $dimSumTitlePath -Value '' -Encoding utf8

          # --- Line count -----------------------------------------------------------
          $reproduce = 'pwsh -NoProfile -File tools/count-release-lines.ps1'
          try {
            if ((& git rev-parse --is-shallow-repository) -eq 'true') {
              Write-Host 'Deepening the shallow checkout so line attribution can see recent history.'
              & git fetch --deepen=1000 --no-tags 2>&1 | ForEach-Object { Write-Host $_ }
            }
          } catch {
            Write-Host "History deepening was skipped: $($_.Exception.Message)"
          }
          $countOut = Join-Path $env:RUNNER_TEMP 'line-count-stdout.md'
          $countErr = Join-Path $env:RUNNER_TEMP 'line-count-stderr.txt'
          $counter = $null
          try {
            $counter = Start-Process -FilePath 'pwsh' -ArgumentList @('-NoProfile', '-File', 'tools/count-release-lines.ps1') -NoNewWindow -Wait -PassThru -RedirectStandardOutput $countOut -RedirectStandardError $countErr
          } catch {
            Write-Host "The line counter could not be started: $($_.Exception.Message)"
          }
          if (Test-Path -LiteralPath $countErr) { Get-Content -LiteralPath $countErr | ForEach-Object { Write-Host $_ } }
          $table = ''
          if (Test-Path -LiteralPath $countOut) { $table = (Get-Content -LiteralPath $countOut -Raw) }
          if ($counter -and $counter.ExitCode -eq 0 -and -not [string]::IsNullOrWhiteSpace($table)) {
            $lineCount = "## Line count`n`nCounted by this workflow run at ``$env:GITHUB_SHA``. Reproduce locally with ``$reproduce`` from the repository root.`n`n$table"
          } else {
            $firstError = ''
            if (Test-Path -LiteralPath $countErr) {
              $errorLines = @(Get-Content -LiteralPath $countErr | Where-Object { $_.Trim() })
              $firstError = @($errorLines | Where-Object { $_ -match '(?i)fail|error|exception|not recognized|denied' } | Select-Object -First 1)[0]
              if (-not $firstError -and $errorLines.Count -gt 0) { $firstError = $errorLines[-1] }
            }
            if (-not $firstError) {
              $exitCode = if ($counter) { $counter.ExitCode } else { 'unknown' }
              $firstError = "the counter exited with code $exitCode and produced no table"
            }
            $lineCount = "## Line count`n`nLine counting failed: $firstError"
          }
          Set-Content -LiteralPath $lineCountPath -Value $lineCount -Encoding utf8

          # --- Dim sum code name and photo ------------------------------------------
          # Best effort only. The public catalog is resolved at run time and never
          # vendored into this repository; if anything about it surprises us we say so
          # in the notes and ship the release without a dish.
          $dimSumSkip = {
            param($reason)
            Write-Host "Dim sum content omitted: $reason"
            Set-Content -LiteralPath $dimSumNotePath -Value "## Dim sum`n`nThe dim sum code name and photo were omitted from this release: $reason" -Encoding utf8
          }
          try {
            $catalogFile = Join-Path $env:RUNNER_TEMP 'dim-sum-catalog.json'
            Invoke-WebRequest -UseBasicParsing -Uri $env:DIM_SUM_CATALOG_URL -OutFile $catalogFile -TimeoutSec 180
            $catalog = Get-Content -LiteralPath $catalogFile -Raw -Encoding utf8 | ConvertFrom-Json -AsHashtable -Depth 24
            if (-not $catalog -or -not ($catalog.Keys -contains 'dishes')) {
              throw "the catalog JSON has no 'dishes' collection (top-level keys: $(@($catalog.Keys) -join ', '))"
            }
            $dishes = @($catalog['dishes'])
            if ($dishes.Count -eq 0) { throw 'the catalog reported an empty dish collection' }
            $usable = @($dishes | Where-Object {
              $_ -is [System.Collections.IDictionary] -and
              $_.Keys -contains 'name' -and $_['name'] -is [System.Collections.IDictionary] -and
              $_['name'].Keys -contains 'en' -and $_['name'].Keys -contains 'zhHant' -and
              -not [string]::IsNullOrWhiteSpace([string]$_['name']['en']) -and
              -not [string]::IsNullOrWhiteSpace([string]$_['name']['zhHant']) -and
              $_.Keys -contains 'image' -and $_['image'] -is [System.Collections.IDictionary] -and
              $_['image'].Keys -contains 'path' -and
              -not [string]::IsNullOrWhiteSpace([string]$_['image']['path'])
            })
            if ($usable.Count -eq 0) { throw "no catalog entry carried the expected name.en, name.zhHant and image.path fields" }
            Write-Host "Catalog resolved: $($dishes.Count) entries, $($usable.Count) usable."

            $previousBodies = ''
            try {
              $previous = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json)
              $previousBodies = ($previous | ForEach-Object { "$($_.name)`n$($_.body)" }) -join "`n"
              Write-Host "Scanned $($previous.Count) earlier release record(s) for dish names already in use."
            } catch {
              Write-Host "Earlier releases could not be scanned, so no dish is treated as used: $($_.Exception.Message)"
            }

            $photoTags = @(gh release list --repo $env:DIM_SUM_PHOTO_REPOSITORY --limit 200 --json tagName,isDraft |
              ConvertFrom-Json |
              Where-Object { -not $_.isDraft -and $_.tagName -like 'catalog-v1*' } |
              Sort-Object -Property tagName |
              ForEach-Object { $_.tagName })
            if ($photoTags.Count -eq 0) { throw 'the public photo repository published no catalog-v1 release' }

            $limit = [int]$env:DIM_SUM_CANDIDATE_LIMIT
            $attempted = 0
            $chosen = $null
            foreach ($dish in $usable) {
              $display = "$([string]$dish['name']['en']) · $([string]$dish['name']['zhHant'])"
              if ($previousBodies -and $previousBodies.Contains($display)) { continue }
              $assetName = Split-Path -Leaf ([string]$dish['image']['path'])
              $attempted++
              foreach ($tag in $photoTags) {
                $url = "https://github.com/$env:DIM_SUM_PHOTO_REPOSITORY/releases/download/$tag/$assetName"
                try {
                  $probe = Invoke-WebRequest -UseBasicParsing -Method Head -Uri $url -TimeoutSec 90
                  if ($probe.StatusCode -eq 200) {
                    $chosen = [pscustomobject]@{ Display = $display; AssetName = $assetName; Url = $url; Tag = $tag }
                    break
                  }
                } catch {
                  # A 404 simply means this volume does not carry the candidate.
                }
              }
              if ($chosen) { break }
              if ($attempted -ge $limit) { break }
            }
            if (-not $chosen) { throw "no unused dish among the first $attempted candidate(s) had a published image asset in $($photoTags -join ', ')" }

            $photoFile = Join-Path $env:RUNNER_TEMP $chosen.AssetName
            Invoke-WebRequest -UseBasicParsing -Uri $chosen.Url -OutFile $photoFile -TimeoutSec 300
            $photoInfo = Get-Item -LiteralPath $photoFile
            if ($photoInfo.Length -le 0) { throw "the downloaded photo $($chosen.AssetName) is empty" }
            $magic = [byte[]](Get-Content -LiteralPath $photoFile -AsByteStream -TotalCount 8)
            $isPng = $magic.Length -ge 8 -and $magic[0] -eq 0x89 -and $magic[1] -eq 0x50 -and $magic[2] -eq 0x4E -and $magic[3] -eq 0x47 -and $magic[4] -eq 0x0D -and $magic[5] -eq 0x0A -and $magic[6] -eq 0x1A -and $magic[7] -eq 0x0A
            $isJpeg = $magic.Length -ge 3 -and $magic[0] -eq 0xFF -and $magic[1] -eq 0xD8 -and $magic[2] -eq 0xFF
            if (-not ($isPng -or $isJpeg)) { throw "the downloaded photo $($chosen.AssetName) is neither PNG nor JPEG" }

            Set-Content -LiteralPath $dimSumAssetPath -Value $photoFile -Encoding utf8
            Set-Content -LiteralPath $dimSumTitlePath -Value "— $($chosen.Display)" -Encoding utf8
            $dimSumNote = "## Dim sum`n`nRelease code name: **$($chosen.Display)**`n`n- Photo asset attached to this release: ``$($chosen.AssetName)`` ($($photoInfo.Length) bytes)`n- Public source: <$($chosen.Url)>`n- Catalog: <$env:DIM_SUM_CATALOG_URL>"
            Set-Content -LiteralPath $dimSumNotePath -Value $dimSumNote -Encoding utf8
            Write-Host "Dim sum code name: $($chosen.Display) ($($chosen.AssetName) from $($chosen.Tag))."
          } catch {
            & $dimSumSkip ($_.Exception.Message -split "`n")[0]
          }

      - name: Publish immutable release
        if: ${{ success() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" | ConvertFrom-Json
          $major = (Select-String Version.kmk -Pattern '^VBOX_VERSION_MAJOR\s*=\s*(\d+)' | ForEach-Object { $_.Matches[0].Groups[1].Value })
          $minor = (Select-String Version.kmk -Pattern '^VBOX_VERSION_MINOR\s*=\s*(\d+)' | ForEach-Object { $_.Matches[0].Groups[1].Value })
          $build = (Select-String Version.kmk -Pattern '^VBOX_VERSION_BUILD\s*=\s*(\d+)' | ForEach-Object { $_.Matches[0].Groups[1].Value })
          $tag = "v$major.$minor.$build-ci.$env:GITHUB_RUN_NUMBER"
          $completed = (Get-Date).ToUniversalTime().ToString('o')
          $start = [DateTimeOffset]::Parse($run.run_started_at)
          $duration = (([DateTimeOffset]::Parse($completed)) - $start).ToString('hh\:mm\:ss')

          # Content fragments written by the preceding step. Each one is best effort and
          # already carries its own explanation when it could not be produced, so a
          # missing fragment is reported rather than allowed to hold up the release.
          $lineCountPath = Join-Path $env:RUNNER_TEMP 'release-line-count.md'
          $lineCount = "## Line count`n`nLine counting failed: the release-content step produced no result."
          if (Test-Path -LiteralPath $lineCountPath) { $lineCount = (Get-Content -LiteralPath $lineCountPath -Raw -Encoding utf8).TrimEnd() }
          $dimSumNotePath = Join-Path $env:RUNNER_TEMP 'release-dim-sum.md'
          $dimSum = "## Dim sum`n`nThe dim sum code name and photo were omitted from this release: the release-content step produced no result."
          if (Test-Path -LiteralPath $dimSumNotePath) { $dimSum = (Get-Content -LiteralPath $dimSumNotePath -Raw -Encoding utf8).TrimEnd() }
          $titleSuffix = ''
          $dimSumTitlePath = Join-Path $env:RUNNER_TEMP 'release-dim-sum-title.txt'
          if (Test-Path -LiteralPath $dimSumTitlePath) { $titleSuffix = (Get-Content -LiteralPath $dimSumTitlePath -Raw -Encoding utf8).Trim() }
          $title = "VirtualBox $tag"
          if ($titleSuffix) { $title = "$title $titleSuffix" }

          $notes = @"
          ## Windows Squirrel package

          This release contains an unsigned Squirrel.Windows full installer built from $env:GITHUB_SHA.

          - Squirrel assets: `Setup.exe`, `RELEASES`, and a full `.nupkg` (plus delta packages when generated).
          - The installer is unsigned and may trigger Windows SmartScreen or unknown-publisher warnings.

          - Workflow started: $($run.run_started_at)
          - Workflow completed: $completed
          - Workflow duration: $duration
          - Checks run in GitHub Actions: build, packaging, asset presence, and unsigned-asset verification. No tests or lint run in GitHub Actions.

          SHA-256:
          $(Get-Content "$env:RUNNER_TEMP\package-hashes.txt" -Raw)

          $lineCount

          $dimSum
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -Path $notesPath -Value $notes -Encoding utf8
          $assets = @(Get-Content "$env:RUNNER_TEMP\package-files.txt")
          $dimSumAssetPath = Join-Path $env:RUNNER_TEMP 'release-dim-sum-asset.txt'
          if (Test-Path -LiteralPath $dimSumAssetPath) {
            $photo = (Get-Content -LiteralPath $dimSumAssetPath -Raw -Encoding utf8).Trim()
            if ($photo -and (Test-Path -LiteralPath $photo)) { $assets += $photo }
          }
          gh release create $tag $assets --target $env:GITHUB_SHA --title $title --notes-file $notesPath --draft
          gh release edit $tag --draft=false
          $completed = (Get-Date).ToUniversalTime().ToString('o')
          $duration = (([DateTimeOffset]::Parse($completed)) - $start).ToString('hh\:mm\:ss')
          # The YAML block scalar strips this step's indentation before PowerShell sees
          # it, so the notes carry no leading spaces and these patterns must not expect
          # any; with the spaces they matched nothing and the published timing never got
          # its final update.
          $notes = $notes -replace '(?m)^- Workflow completed: .+$', "- Workflow completed: $completed"
          $notes = $notes -replace '(?m)^- Workflow duration: .+$', "- Workflow duration: $duration"
          Set-Content -Path $notesPath -Value $notes -Encoding utf8
          gh release edit $tag --notes-file $notesPath
