name: Material 3 validation

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: md3-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive-and-source-contract:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Validate design ledger and manifest
        shell: pwsh
        run: |
          ./tools/md3/generate-design-coverage.ps1
          $rows = (Select-String -Path doc/md3/DesignCoverage.md -Pattern '^\| ARCH-' | Measure-Object).Count
          if ($rows -ne 69) { throw "Expected 69 design rows, found $rows" }
          if ((Get-Content doc/md3/ArchiveManifest.sha256 | Measure-Object -Line).Lines -ne 69) { throw 'Archive manifest must contain 69 entries' }
          git diff --exit-code -- doc/md3/DesignCoverage.md doc/md3/ArchiveManifest.sha256
      - name: Validate MD3 source wiring
        shell: pwsh
        run: |
          $make = Get-Content src/VBox/Frontends/VirtualBox/Makefile.kmk -Raw
          foreach ($path in @('src/md3/UIMd3AppearanceEditor.cpp','src/md3/UIMd3Theme.cpp','src/md3/UIMd3Style.cpp','src/md3/UIMd3Language.cpp','src/md3/UIMd3NavigationRail.cpp','src/md3/UIMd3RegexBuilder.cpp','src/md3/UIMd3SearchField.cpp','src/md3/UIMd3CommandPalette.cpp','src/md3/UIMd3History.cpp','src/md3/UIMd3NotificationCentre.cpp','src/md3/UIMd3Wizard.cpp','src/md3/UIMd3TabStrip.cpp','src/md3/UIMd3Icons.qrc')) {
            if ($make -notmatch [regex]::Escape($path)) { throw "Missing kBuild source: $path" }
          }
          foreach ($path in @('src/md3/UIMd3AppearanceEditor.h','src/md3/UIMd3Tokens.h','src/md3/UIMd3Theme.h','src/md3/UIMd3Style.h','src/md3/UIMd3Language.h','src/md3/UIMd3NavigationRail.h','src/md3/UIMd3RegexBuilder.h','src/md3/UIMd3SearchField.h','src/md3/UIMd3CommandPalette.h','src/md3/UIMd3History.h','src/md3/UIMd3NotificationCentre.h','src/md3/UIMd3Wizard.h','src/md3/UIMd3TabStrip.h')) {
            if ($make -notmatch [regex]::Escape($path)) { throw "Missing Qt MOC header: $path" }
            if (-not (Test-Path "src/VBox/Frontends/VirtualBox/$path")) { throw "Missing production MD3 header: $path" }
          }
          if ($make -notmatch [regex]::Escape('./src/md3')) { throw 'Missing MD3 include directory' }
          $qrc = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3Icons.qrc -Raw
          $iconCount = ([regex]::Matches($qrc, '<file ')).Count
          if ($iconCount -ne 27) { throw "Expected 27 bundled MD3 icons, found $iconCount" }
          $makeLines = Get-Content src/VBox/Frontends/VirtualBox/Makefile.kmk
          $virtualBoxSourcesAt = ($makeLines | Select-String '^VirtualBox_SOURCES =').LineNumber
          $virtualBoxVMSourcesAt = ($makeLines | Select-String '^VirtualBoxVM_SOURCES =').LineNumber
          $uiCommonSourcesAt = ($makeLines | Select-String '^UICommon_SOURCES =').LineNumber
          $virtualBoxSources = ($makeLines[($virtualBoxSourcesAt - 1)..($virtualBoxVMSourcesAt - 2)] -join "`n")
          $uiCommonSources = ($makeLines[($uiCommonSourcesAt - 1)..($makeLines.Count - 1)] -join "`n")
          foreach ($path in @('src/md3/UIMd3AppearanceEditor.cpp','src/md3/UIMd3Language.cpp','src/md3/UIMd3Theme.cpp','src/md3/UIMd3Style.cpp','src/md3/UIMd3CommandPalette.cpp','src/md3/UIMd3History.cpp','src/md3/UIMd3NotificationCentre.cpp','src/md3/UIMd3Wizard.cpp','src/md3/UIMd3TabStrip.cpp')) {
            if ($virtualBoxSources -match [regex]::Escape($path)) { throw "Shared MD3 source must not be linked only by VirtualBox: $path" }
            if ($uiCommonSources -notmatch [regex]::Escape($path)) { throw "Shared MD3 source missing from UICommon: $path" }
          }
          $wizardHeader = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3Wizard.h -Raw
          $wizardSource = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3Wizard.cpp -Raw
          foreach ($pattern in @('class SHARED_LIBRARY_STUFF UIMd3Wizard', 'setStepTitles', 'setCurrentStep', 'setContentWidget')) {
            if (($wizardHeader + $wizardSource) -notmatch [regex]::Escape($pattern)) { throw "Wizard shell contract missing: $pattern" }
          }
          $nativeWizard = Get-Content src/VBox/Frontends/VirtualBox/src/wizards/UINativeWizard.cpp -Raw
          foreach ($pattern in @('UIMd3Wizard.h', 'new UIMd3Wizard', 'setContentWidget', 'setStepTitles')) {
            if ($nativeWizard -notmatch [regex]::Escape($pattern)) { throw "Native wizard composition missing: $pattern" }
          }
          if (-not (Test-Path doc/md3/WizardShell.md)) { throw 'Missing wizard shell article' }
          $notificationHeader = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3NotificationCentre.h -Raw
          $notificationSource = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3NotificationCentre.cpp -Raw
          foreach ($pattern in @('class SHARED_LIBRARY_STUFF UIMd3NotificationCentre', 'UIMd3History', 'notification history cleared', 'notification history restored', 'post(', 'markAllRead', 'showCentre', 'g_iMaxPayload', 'QSaveFile', 'UIMd3SearchField', 'QCheckBox', 'sltSelectAllVisible', 'sltInvertVisibleSelection', 'sltExportVisible', 'visibleNoticeIds', 'm_selectedIds', 'sltRequestClear', 'sltUndoClear', 'undoStoragePath', 'saveRecordsAtPath', 'restoreUndoSnapshot', 'Undo last clear', 'QDialogButtonBox', 'QSlider', 'QProgressBar', 'Emergency exit', 'QAbstractAnimation::DeleteWhenStopped', 'clear()')) {
            if (($notificationHeader + $notificationSource) -notmatch [regex]::Escape($pattern)) { throw "Notification history contract missing: $pattern" }
          }
          if (-not (Test-Path doc/md3/NotificationCentre.md)) { throw 'Missing notification-center article' }
          $historyHeader = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3History.h -Raw
          $historySource = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3History.cpp -Raw
          foreach ($pattern in @('class SHARED_LIBRARY_STUFF UIMd3History', 'record(', 'latestRevision', 'stateFor', 'QProcess', 'QSaveFile', 'QCryptographicHash', 'g_iMaxRevisions')) {
            if (($historyHeader + $historySource) -notmatch [regex]::Escape($pattern)) { throw "History journal contract missing: $pattern" }
          }
          if (-not (Test-Path doc/md3/History.md)) { throw 'Missing local-history article' }
          $mainSource = Get-Content src/VBox/Frontends/VirtualBox/src/main.cpp -Raw
          foreach ($pattern in @('UIMd3History.h', 'UIMd3History::create()', 'UIMd3History::destroy()', 'UIMd3NotificationCentre::create()', 'UIMd3NotificationCentre::destroy()')) {
            if ($mainSource -notmatch [regex]::Escape($pattern)) { throw "Notification lifecycle missing: $pattern" }
          }
          $managerHeader = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3ManagerHeader.h -Raw
          $managerSource = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3ManagerHeader.cpp -Raw
          foreach ($pattern in @('UIMd3NotificationCentre.h', 'showCentre', 'hasUnread', 'updateNotificationState')) {
            if (($managerHeader + $managerSource) -notmatch [regex]::Escape($pattern)) { throw "Manager notification action contract missing: $pattern" }
          }
      - name: Validate notification search integration
        shell: pwsh
        run: |
          $notificationSource = Get-Content src/VBox/Frontends/VirtualBox/src/notificationcenter/UINotificationCenter.cpp -Raw
          foreach ($pattern in @('UIMd3SearchField', 'updateItemVisibility', 'pObject->name\(\)', 'pObject->details\(\)', 'pObject->internalName\(\)', 'pObject->helpKeyword\(\)', 'isExtendedMode\(\) \|\| pItem->isCritical\(\)', 'UIMd3NotificationCentre::instance\(\)->post', 'fPersistHistory')) {
            if ($notificationSource -notmatch $pattern) { throw "Notification search contract missing: $pattern" }
          }
           if (-not (Test-Path doc/md3/NotificationCentre.md)) { throw 'Missing notification-center article' }
      - name: Validate tab group picker integration
        shell: pwsh
        run: |
          $tabHeader = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3TabStrip.h -Raw
          $tabSource = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3TabStrip.cpp -Raw
          foreach ($pattern in @('showGroupPicker', 'Move… into group…', 'tab-group-picker', 'QListWidget', 'createGroup', 'member', 'QToolButton', 'Show more tabs', 'updateOverflowButton')) {
            if (($tabHeader + $tabSource) -notmatch [regex]::Escape($pattern)) { throw "Tab group picker contract missing: $pattern" }
          }
          if (-not (Test-Path doc/md3/TabNavigation.md)) { throw 'Missing tab-navigation article' }
      - name: Collect safe validation evidence
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          git status --short | Set-Content artifacts/git-status.txt
          git rev-parse HEAD | Set-Content artifacts/revision.txt
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: md3-validation-evidence
          path: artifacts
          if-no-files-found: warn
          retention-days: 7
