name: Material 3 validation

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: md3-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive-and-source-contract:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Validate design ledger and manifest
        shell: pwsh
        run: |
          ./tools/md3/generate-design-coverage.ps1
          $rows = (Select-String -Path doc/md3/DesignCoverage.md -Pattern '^\| ARCH-' | Measure-Object).Count
          if ($rows -ne 69) { throw "Expected 69 design rows, found $rows" }
          if ((Get-Content doc/md3/ArchiveManifest.sha256 | Measure-Object -Line).Lines -ne 69) { throw 'Archive manifest must contain 69 entries' }
          git diff --exit-code -- doc/md3/DesignCoverage.md doc/md3/ArchiveManifest.sha256
      - name: Validate MD3 source wiring
        shell: pwsh
        run: |
          $make = Get-Content src/VBox/Frontends/VirtualBox/Makefile.kmk -Raw
          foreach ($path in @('src/md3/UIMd3AppearanceEditor.cpp','src/md3/UIMd3Hct.cpp','src/md3/UIMd3Theme.cpp','src/md3/UIMd3Style.cpp','src/md3/UIMd3Language.cpp','src/md3/UIMd3NavigationRail.cpp','src/md3/UIMd3RegexBuilder.cpp','src/md3/UIMd3SearchField.cpp','src/md3/UIMd3MenuSearch.cpp','src/md3/UIMd3CommandPalette.cpp','src/md3/UIMd3History.cpp','src/md3/UIMd3NotificationCentre.cpp','src/md3/UIMd3Wizard.cpp','src/md3/UIMd3TabManager.cpp','src/md3/UIMd3TabStrip.cpp','src/md3/UIMd3Icons.qrc')) {
            if ($make -notmatch [regex]::Escape($path)) { throw "Missing kBuild source: $path" }
          }
          if (-not (Test-Path 'src/VBox/Frontends/VirtualBox/src/md3/UIMd3MenuSearch.h')) { throw 'Missing shared searchable-menu helper header' }
          foreach ($path in @('src/md3/UIMd3AppearanceEditor.h','src/md3/UIMd3Tokens.h','src/md3/UIMd3Theme.h','src/md3/UIMd3Style.h','src/md3/UIMd3Language.h','src/md3/UIMd3NavigationRail.h','src/md3/UIMd3RegexBuilder.h','src/md3/UIMd3SearchField.h','src/md3/UIMd3CommandPalette.h','src/md3/UIMd3History.h','src/md3/UIMd3NotificationCentre.h','src/md3/UIMd3Wizard.h','src/md3/UIMd3TabManager.h','src/md3/UIMd3TabStrip.h')) {
            if ($make -notmatch [regex]::Escape($path)) { throw "Missing Qt MOC header: $path" }
            if (-not (Test-Path "src/VBox/Frontends/VirtualBox/$path")) { throw "Missing production MD3 header: $path" }
          }
          if ($make -notmatch [regex]::Escape('./src/md3')) { throw 'Missing MD3 include directory' }
          $qrc = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3Icons.qrc -Raw
          $iconCount = ([regex]::Matches($qrc, '<file ')).Count
          if ($iconCount -ne 27) { throw "Expected 27 bundled MD3 icons, found $iconCount" }
          $makeLines = Get-Content src/VBox/Frontends/VirtualBox/Makefile.kmk
          $virtualBoxSourcesAt = ($makeLines | Select-String '^VirtualBox_SOURCES =').LineNumber
          $virtualBoxVMSourcesAt = ($makeLines | Select-String '^VirtualBoxVM_SOURCES =').LineNumber
          $uiCommonSourcesAt = ($makeLines | Select-String '^UICommon_SOURCES =').LineNumber
          $virtualBoxSources = ($makeLines[($virtualBoxSourcesAt - 1)..($virtualBoxVMSourcesAt - 2)] -join "`n")
          $uiCommonSources = ($makeLines[($uiCommonSourcesAt - 1)..($makeLines.Count - 1)] -join "`n")
          foreach ($path in @('src/md3/UIMd3AppearanceEditor.cpp','src/md3/UIMd3Hct.cpp','src/md3/UIMd3Language.cpp','src/md3/UIMd3Theme.cpp','src/md3/UIMd3Style.cpp','src/md3/UIMd3MenuSearch.cpp','src/md3/UIMd3CommandPalette.cpp','src/md3/UIMd3History.cpp','src/md3/UIMd3NotificationCentre.cpp','src/md3/UIMd3Wizard.cpp','src/md3/UIMd3TabManager.cpp','src/md3/UIMd3TabStrip.cpp')) {
            if ($virtualBoxSources -match [regex]::Escape($path)) { throw "Shared MD3 source must not be linked only by VirtualBox: $path" }
            if ($uiCommonSources -notmatch [regex]::Escape($path)) { throw "Shared MD3 source missing from UICommon: $path" }
          }
          $wizardHeader = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3Wizard.h -Raw
          $wizardSource = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3Wizard.cpp -Raw
          foreach ($pattern in @('class SHARED_LIBRARY_STUFF UIMd3Wizard', 'setStepTitles', 'setCurrentStep', 'setContentWidget', 'setFocusPolicy(Qt::NoFocus)', 'setAccessibleName', 'setAccessibleDescription', 'Current wizard page', 'Wizard progress', 'Current step', 'Completed step', 'Upcoming step')) {
            if (($wizardHeader + $wizardSource) -notmatch [regex]::Escape($pattern)) { throw "Wizard shell contract missing: $pattern" }
          }
          $nativeWizard = Get-Content src/VBox/Frontends/VirtualBox/src/wizards/UINativeWizard.cpp -Raw
          foreach ($pattern in @('UIMd3Wizard.h', 'new UIMd3Wizard', 'setContentWidget', 'setStepTitles', 'wizardPageStack', 'Wizard pages', 'Current wizard page:', 'setAccessibleName', 'setAccessibleDescription', 'fPageComplete', 'fLastPage', 'Complete the current wizard page before continuing', 'Go to the previous wizard page', 'Go to the next wizard page after validation', 'Validate and commit all wizard data', 'Cancel this wizard without committing its data')) {
            if ($nativeWizard -notmatch [regex]::Escape($pattern)) { throw "Native wizard composition missing: $pattern" }
          }
          if (-not (Test-Path doc/md3/WizardShell.md)) { throw 'Missing wizard shell article' }
          $paletteHeader = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3CommandPalette.h -Raw
          $paletteSource = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3CommandPalette.cpp -Raw
          foreach ($pattern in @('class SHARED_LIBRARY_STUFF UIMd3CommandPalette', 'registerCommand', 'unregisterSource', 'showPalette', 'UIMd3Button', 'UIMd3SearchField', 'focusProxy', 'matches(', 'Qt::Key_Escape', 'Qt::Key_Up', 'Qt::Key_Down', 'sigClicked', 'setAccessibleDescription', 'setEnabledState', 'setActivationEnabled', 'enabledPredicate', 'strDisabledReason', 'strId', 'QMap', 'availableGeometry', 'setMinimumSize', 'eventFilter', 'strCategory', 'registerMd3PaletteTexts', 'md3Text(')) {
            if (($paletteHeader + $paletteSource) -notmatch [regex]::Escape($pattern)) { throw "Command palette contract missing: $pattern" }
          }
          $managerSource = Get-Content src/VBox/Frontends/VirtualBox/src/manager/UIVirtualBoxManager.cpp -Raw
          if (([regex]::Matches($managerSource, [regex]::Escape('QStringLiteral("manager")'))).Count -lt 2) { throw 'Command palette manager source id is not stable across registration and cleanup.' }
          foreach ($pattern in @('registerCommandPaletteCommands', 'sigLanguageChanged', 'sltRetranslateUI', 'registerManagerText', 'managerText', 'md3Text(', 'md3.manager.', 'isGlobalToolEnabled', 'open-home-tool', 'open-extensions-tool', 'pAction->isEnabled()', 'UIMd3CommandPalette::unregisterSource')) {
            if ($managerSource -notmatch [regex]::Escape($pattern)) { throw "Command palette manager refresh contract missing: $pattern" }
          }
          $toolsItemHeader = Get-Content src/VBox/Frontends/VirtualBox/src/manager/tools/UIToolsItem.h -Raw
          $toolsItemSource = Get-Content src/VBox/Frontends/VirtualBox/src/manager/tools/UIToolsItem.cpp -Raw
          foreach ($pattern in @('UIMd3Language.h', 'UIMd3Language::instance()', 'registerMd3ToolTexts', 'md3ToolText', 'md3.tool.toggle', 'md3.tool.home', 'md3.tool.machines', 'md3.tool.extensions', 'md3.tool.media', 'md3.tool.network', 'md3.tool.cloud', 'md3.tool.resources', 'md3.tool.details', 'md3.tool.snapshots', 'md3.tool.logs', 'md3.tool.resource-use', 'md3.tool.file-manager', 'md3.tool.description', 'md3Text(', 'tr("Show text")', 'translationEventListener', 'sigLanguageChanged', 'Qt::UniqueConnection', 'setName', 'm_strDescription')) {
            if (($toolsItemHeader + $toolsItemSource) -notmatch [regex]::Escape($pattern)) { throw "Manager tool-language contract missing: $pattern" }
          }
          $styleHeader = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3Style.h -Raw
          $styleSource = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3Style.cpp -Raw
          foreach ($pattern in @('polish(QApplication', 'polish(QPalette', 'polish(QWidget', 'sigThemeChanged', 'md3StyleStateColor', 'PE_PanelButtonCommand', 'PE_IndicatorCheckBox', 'PE_IndicatorRadioButton', 'PE_PanelItemViewItem', 'PE_PanelMenu', 'PE_FrameGroupBox', 'PE_PanelToolBar', 'PE_PanelStatusBar', 'CE_TabBarTabShape', 'CE_MenuItem', 'CE_HeaderSection', 'CE_ProgressBarContents', 'CC_ComboBox', 'CC_Slider', 'CC_SpinBox', 'CC_ScrollBar', 'CT_CheckBox', 'CT_MenuItem', 'CT_TabBarTab', 'CT_ItemViewItem', 'CT_HeaderSection', 'PM_ScrollBarSliderMin', 'SH_ScrollBar_Transient', 'qMax(48, md3Theme().controlHeight())')) {
            if (($styleHeader + $styleSource) -notmatch [regex]::Escape($pattern)) { throw "Stock-control Material style contract missing: $pattern" }
          }
          if (-not (Test-Path doc/md3/StockControlStyle.md)) { throw 'Missing stock-control style article' }
          $settingsDialogHeader = Get-Content src/VBox/Frontends/VirtualBox/src/settings/UIAdvancedSettingsDialog.h -Raw
          $settingsDialogSource = Get-Content src/VBox/Frontends/VirtualBox/src/settings/UIAdvancedSettingsDialog.cpp -Raw
          $settingsSpecificSource = Get-Content src/VBox/Frontends/VirtualBox/src/settings/UIAdvancedSettingsDialogSpecific.cpp -Raw
          $settingsSelectorSource = Get-Content src/VBox/Frontends/VirtualBox/src/settings/UISettingsSelector.cpp -Raw
          $settingsPageSource = Get-Content src/VBox/Frontends/VirtualBox/src/settings/UISettingsPage.cpp -Raw
          foreach ($pattern in @('enum DialogType { Type_Global, Type_Machine }', 'updateMd3PageVisibility', 'pCurrentFrame->isHidden()', 'm_pSelector->selectById(iId, true', 'GUI/Md3/SettingsCustomizationExpanded', 'm_enmDialogType == Type_Global', 'strCurrent.isEmpty() && !fExpanded', 'QGridLayout *pCustomizationLayout', 'setColumnMinimumWidth(0, 132)', 'UIMd3SearchField', 'setMinimumHeight(48)')) {
            if (($settingsDialogHeader + $settingsDialogSource) -notmatch [regex]::Escape($pattern)) { throw "Material settings-shell contract missing: $pattern" }
          }
          $settingsCategoryHandler = [regex]::Match($settingsDialogSource, 'void UIAdvancedSettingsDialog::sltCategoryChanged\(int cId\).*?(?=void UIAdvancedSettingsDialog::)', [System.Text.RegularExpressions.RegexOptions]::Singleline).Value
          if (   $settingsCategoryHandler.IndexOf('setHelpKeyword') -lt 0 -or
                 $settingsCategoryHandler.IndexOf('setHelpKeyword') -gt $settingsCategoryHandler.IndexOf('if (!fSearchActive)')) {
            throw 'Ordinary settings navigation must refresh Help before its early return'
          }
          foreach ($pattern in @('Type_Global', 'Type_Machine')) {
            if ($settingsSpecificSource -notmatch [regex]::Escape($pattern)) { throw "Settings dialog ownership missing: $pattern" }
          }
          foreach ($pattern in @('ScrollBarAsNeeded', 'setUniformItemSizes(true)', 'UIMd3ColorRole_SecondaryContainer', 'UIMd3ColorRole_OnSecondaryContainer', 'qMax(48, iMinimumHeight)')) {
            if ($settingsSelectorSource -notmatch [regex]::Escape($pattern)) { throw "Material settings selector contract missing: $pattern" }
          }
          foreach ($pattern in @('UIMd3ColorRole_SurfaceContainerLow', 'UIMd3ColorRole_OutlineVariant', 'UIMd3Shape::Large', 'UIMd3TypeRole_TitleLarge')) {
            if ($settingsPageSource -notmatch [regex]::Escape($pattern)) { throw "Material settings page-card contract missing: $pattern" }
          }
          if (-not (Test-Path doc/md3/SettingsShell.md)) { throw 'Missing settings-shell article' }
          $managerHeaderSource = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3ManagerHeader.cpp -Raw
          foreach ($pattern in @('setFixedHeight(48)', 'm_pBrandMark', 'm_pSubtitle', 'm_pPalette', 'setFixedSize(QSize(48, 48))', 'updateResponsiveLayout', 'WindowStateChange', 'startSystemMove', 'md3HeaderIcon', 'md3PrepareSearchableMenu', 'showCentre', 'showPalette')) {
            if ($managerHeaderSource -notmatch [regex]::Escape($pattern)) { throw "Responsive manager-header contract missing: $pattern" }
          }
          $navigationRailSource = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3NavigationRail.cpp -Raw
          foreach ($pattern in @('setFixedWidth(92)', 'UIMd3NavigationButton', 'pillRect', 'QScrollArea', 'sigPreferencesRequested', 'elidedText', 'UIMd3TypeRole_LabelSmall', 'sigLanguageChanged', 'Qt::UniqueConnection', 'm_navigationOrder', 'md3TintedRailIcon', 'updateIcons', 'disabledReason', 'ScreenChangeInternal', 'DevicePixelRatioChange', 'md3.manager.navigation-rail')) {
            if ($navigationRailSource -notmatch [regex]::Escape($pattern)) { throw "Responsive navigation-rail contract missing: $pattern" }
          }
          $tabStripSource = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3TabStrip.cpp -Raw
          $tabStripHeader = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3TabStrip.h -Raw
          foreach ($pattern in @('setFixedHeight(48)', 'setFixedSize(QSize(48, 48))', 'migrateLegacyGeneratedLayout', 'setTabsEnabled', 'setAvailableTabs', 'md3-tab-model-v2', 'GUI/Md3/Tabs/', 'strPersistenceScope', 'm_strPersistenceKey', 'UIMd3TabManager::registerStrip', 'UIMd3TabManager::manage', 'Ctrl+Shift+T', 'resolveCloseSet', 'strRegexFlags', 'md3PageTabList', 'QAccessible::PageTabList', 'QAccessible::PageTab', 'actionNames()', 'doAction', 'keyBindingsForAction', 'QAccessibleActionInterface::pressAction()', 'm_pTabList', 'm_closeButtons', 'm_pNewTabButton', 'm_pTabManagerButton', 'tabCloseRect', 'isTabFullyVisible', 'hasOverflow', 'tabContentRight', 'setClipRect', 'm_iFirstVisiblePinned', 'm_iFirstVisibleUnpinned', 'ensureTabVisible', 'tab.strId == m_strCurrentId', 'pItem->isHidden()', 'setMaxLength(80)', 'md3.tabs.group.no-match', 'md3.tabs.overflow-menu', 'qBound(120, metrics.horizontalAdvance(tab.strLabel) + 72, 210)')) {
            if (($tabStripHeader + $tabStripSource) -notmatch [regex]::Escape($pattern)) { throw "Accessible tab-strip contract missing: $pattern" }
          }
          $managerShellWidget = Get-Content src/VBox/Frontends/VirtualBox/src/manager/UIVirtualBoxWidget.cpp -Raw
          foreach ($pattern in @('md3LegacyGeneratedTabIds', 'migrateLegacyGeneratedLayout', 'setTabsEnabled', 'setAvailableTabs', 'togglePinned', 'openTab(strId', 'ToolButtonTextBesideIcon', 'md3PrepareSearchableMenu', 'setFixedHeight(64)', 'setMinimumHeight(48)', 'setMinimumWidth(48)')) {
            if ($managerShellWidget -notmatch [regex]::Escape($pattern)) { throw "On-demand workspace contract missing: $pattern" }
          }
          $managerWindowSource = Get-Content src/VBox/Frontends/VirtualBox/src/manager/UIVirtualBoxManager.cpp -Raw
          foreach ($pattern in @('setMinimumSize(QSize(640, 360))', 'availableGeometry()', 'HTMAXBUTTON', 'HTCAPTION', 'WM_NCLBUTTONDOWN', 'WM_NCLBUTTONUP', 'pMaximize->click()', 'menuBar()->hide()')) {
            if ($managerWindowSource -notmatch [regex]::Escape($pattern)) { throw "Manager-window composition contract missing: $pattern" }
          }
          $globalToolsSource = Get-Content src/VBox/Frontends/VirtualBox/src/manager/UIGlobalToolsWidget.cpp -Raw
          foreach ($pattern in @('md3DestinationHeader', 'updatePageHeader', 'Machine tools', 'No machine selected', 'md3NavigationDrawerButton', 'width() < 1000', 'md3PrepareSearchableMenu', 'm_pPageHeaderLayout->addWidget')) {
            if ($globalToolsSource -notmatch [regex]::Escape($pattern)) { throw "Contextual destination-header contract missing: $pattern" }
          }
          $machineToolsSource = Get-Content src/VBox/Frontends/VirtualBox/src/manager/UIMachineToolsWidget.cpp -Raw
          foreach ($pattern in @('setContentsMargins(20, 12, 20, 14)', 'setHandleWidth(12)', 'setMinimumWidth(240)', 'setMaximumWidth(360)', 'sizes[0] = 274')) {
            if ($machineToolsSource -notmatch [regex]::Escape($pattern)) { throw "Bounded machine-workspace contract missing: $pattern" }
          }
          $buttonSource = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3Button.cpp -Raw
          foreach ($pattern in @('fUsesGeneratedAppearanceKey', 'UIMd3ButtonVariant_Icon', 'Qt::AlignCenter', 'QAccessibleWidget', 'QAccessible::Button', 'QAccessibleActionInterface::pressAction()', 'setActivationEnabled', 'QAccessibleStateChangeEvent')) {
            if ($buttonSource -notmatch [regex]::Escape($pattern)) { throw "Compact icon-button contract missing: $pattern" }
          }
          $toolBarSource = Get-Content src/VBox/Frontends/VirtualBox/src/extensions/QIToolBar.cpp -Raw
          foreach ($pattern in @('ToolButtonTextOnly', 'ToolButtonTextBesideIcon', 'ToolButtonTextUnderIcon')) {
            if ($toolBarSource -notmatch [regex]::Escape($pattern)) { throw "Toolbar text-bearing style contract missing: $pattern" }
          }
          $menuSearchSource = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3MenuSearch.cpp -Raw
          foreach ($pattern in @('UIMd3SearchField', 'sigFilterChanged', 'matches(', 'QWidgetAction', 'QKeySequence::NativeText', 'md3SynchronizeMenuProxy', 'md3OriginalVisible', 'pMenu->removeAction(pOriginal)', 'original->trigger()', 'pProxy->setVisible')) {
            if ($menuSearchSource -notmatch [regex]::Escape($pattern)) { throw "Searchable-menu contract missing: $pattern" }
          }
          if ($menuSearchSource -match [regex]::Escape('pOriginal->setVisible')) { throw 'Searchable menus must never mutate shared original action visibility.' }
          if (-not (Test-Path doc/md3/ManagerShell.md)) { throw 'Missing manager-shell article' }
          if (-not (Test-Path doc/md3/CommandPalette.md)) { throw 'Missing command-palette article' }
          $readme = Get-Content README.md -Raw
          foreach ($pattern in @('https://ding-ding-projects.github.io/material-virtualbox/', 'no verified installer is published yet', '<details>', '<summary><strong>Build from source and local prerequisites</strong></summary>')) {
            if ($readme -notmatch [regex]::Escape($pattern)) { throw "Compact README contract missing: $pattern" }
          }
          if ([regex]::Matches($readme, '<details>').Count -lt 7) { throw 'README reference sections are not fully collapsible' }
          $pagesIndex = Get-Content docs/index.html -Raw
          foreach ($pattern in @('id="tab-overview"', 'tabindex="-1"', 'role="tabpanel" tabindex="0"', '.panel:focus-visible', 'minmax(min(230px,100%),1fr)', '@media(max-width:480px)', 'aria-labelledby="tab-coverage"', 'aria-labelledby="tab-verification"', 'event.key === ''ArrowRight''', 'event.key === ''ArrowLeft''', 'event.key === ''Home''', 'event.key === ''End''', 'panel.hidden = !selected')) {
            if ($pagesIndex -notmatch [regex]::Escape($pattern)) { throw "Accessible Pages tabs contract missing: $pattern" }
          }
          $managerWidget = Get-Content src/VBox/Frontends/VirtualBox/src/manager/UIVirtualBoxWidget.cpp -Raw
          $managerWidgetHeader = Get-Content src/VBox/Frontends/VirtualBox/src/manager/UIVirtualBoxWidget.h -Raw
          foreach ($pattern in @('isGlobalToolEnabled', 'isMenuToolEnabled')) {
            if (($managerWidget + $managerWidgetHeader) -notmatch [regex]::Escape($pattern)) { throw "Global tool palette predicate missing: $pattern" }
          }
          $notificationHeader = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3NotificationCentre.h -Raw
          $notificationSource = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3NotificationCentre.cpp -Raw
          foreach ($pattern in @('class SHARED_LIBRARY_STUFF UIMd3NotificationCentre', 'UIMd3History', 'notification history cleared', 'notification history restored', 'sltRestoreHistoryRevision', 'currentState', 'post(', 'markAllRead', 'showCentre', 'g_iMaxPayload', 'QSaveFile', 'UIMd3SearchField', 'QCheckBox', 'sltSelectAllVisible', 'sltInvertVisibleSelection', 'sltExportVisible', 'visibleNoticeIds', 'm_selectedIds', 'sltRequestClear', 'sltUndoClear', 'undoStoragePath', 'saveRecordsAtPath', 'restoreUndoSnapshot', 'Undo last clear', 'QDialogButtonBox', 'QSlider', 'QProgressBar', 'Emergency exit', 'QAbstractAnimation::DeleteWhenStopped', 'clear()')) {
            if (($notificationHeader + $notificationSource) -notmatch [regex]::Escape($pattern)) { throw "Notification history contract missing: $pattern" }
          }
          if (-not (Test-Path doc/md3/NotificationCentre.md)) { throw 'Missing notification-center article' }
          $historyHeader = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3History.h -Raw
          $historySource = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3History.cpp -Raw
          foreach ($pattern in @('class SHARED_LIBRARY_STUFF UIMd3History', 'record(', 'latestRevision', 'stateFor', 'filtered(', 'knownActions', 'verifyIntegrity', 'visibleCentreRows', 'matches(', 'sigRevisionRestoreRequested', 'sigRevisionRestoreCompleted', 'sltRestoreCentre', 'sltRestoreResult', 'Qt::UniqueConnection', 'QProcess', 'pInit', 'decodeBase64', 'QSaveFile', 'QCryptographicHash', 'g_iMaxRevisions', 'g_iMaxPayload', 'md3.history.summary', 'md3.history.exported', 'md3.history.restore')) {
            if (($historyHeader + $historySource) -notmatch [regex]::Escape($pattern)) { throw "History journal contract missing: $pattern" }
          }
          if ($historySource -match 'waitForFinished') { throw 'History startup must not wait synchronously for optional Git.' }
          if ($historySource -match 'Restore notification state|Notification state restored from revision|notification-state revision') {
            throw 'History restore copy must remain truthful for notification and appearance/theme revisions.'
          }
          if (-not (Test-Path doc/md3/History.md)) { throw 'Missing local-history article' }
          $themeHeader = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3Theme.h -Raw
          $themeSource = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3Theme.cpp -Raw
          foreach ($pattern in @('serializeState', 'restoreState', 'sltRestoreHistoryRevision', 'recordHistory', 'g_iThemeHistorySchema', 'g_iMaxHistoryAppearanceEntries', 'g_cbMaxThemePayload', 'md3SerializeNamedThemes', 'md3ColorString', 'namedThemes', 'fontFamily', 'setFontFamily', 'fontWeight', 'setFontWeight', 'g_pszKeyWeight', 'setAppearance', 'saveNamedTheme', 'applyNamedTheme', 'importNamedThemes', 'QColor::HexArgb', 'std::isfinite', 'UIMd3History::instance()->record', 'sigThemeChanged')) {
            if (($themeHeader + $themeSource) -notmatch [regex]::Escape($pattern)) { throw "Theme history contract missing: $pattern" }
          }
          $appearanceEditorSource = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3AppearanceEditor.cpp -Raw
          foreach ($pattern in @('QScrollArea', 'availableGeometry', 'focusInitialControl', 'appearance-editor/save-theme', 'appearance-editor/apply-theme', 'setAccessibleDescription', 'QAccessibleAnnouncementEvent', 'ThemeStatusKind', 'reannounceThemeStatus', 'QRegularExpression', 'QSpinBox', 'QDoubleSpinBox', 'setAppearanceKey')) {
            if ($appearanceEditorSource -notmatch [regex]::Escape($pattern)) { throw "Appearance editor contract missing: $pattern" }
          }
          $searchFieldHeader = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3SearchField.h -Raw
          $searchFieldSource = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3SearchField.cpp -Raw
          foreach ($pattern in @('QPointer<UIMd3RegexBuilder>', 'QPointer<QScrollArea>', 'setPlaceholderText', 'setFocusProxy', 'm_pEditor->setAccessibleName', 'QSignalBlocker', 'updateRegexPresentation', 'm_pBuilderButton->setChecked', 'regexFlags()', 'md3NormalizeRegexFlags', 'QScreen', 'availableGeometry', 'sigLanguageChanged', 'QObject::destroyed', 'qobject_cast<QMenu*>', 'setWindowFlags(Qt::Widget)', 'md3InlineRegexBuilderScrollArea', 'setWidgetResizable(true)')) {
            if (($searchFieldHeader + $searchFieldSource) -notmatch [regex]::Escape($pattern)) { throw "Search field contract missing: $pattern" }
          }
          $regexBuilderSource = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3RegexBuilder.cpp -Raw
          $regexBuilderHeader = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3RegexBuilder.h -Raw
          foreach ($pattern in @('md3ValidateRegexFlags', 'strResult.contains(ch)', 'Invalid flags:', 'sigPatternAccepted(m_pPattern->text(), strFlags)', 'Guided construction', 'Insert escaped literal', 'Character class', 'Anchor', 'Capturing group', 'Insert alternation', 'Quantifier', 'QSpinBox', 'Minimum repeats', 'Maximum repeats', 'QPlainTextEdit', 'QTreeWidget', 'namedCaptureGroups', 'Copy pattern', 'Export JSON', 'Qt QRegularExpression / PCRE2-compatible', 'QSaveFile', 'QAccessibleAnnouncementEvent', 'g_cchRegexPreviewSample = 4096', 'g_cRegexPreviewMatches = 256', 'g_cRegexPreviewRows = 2048', 'g_msRegexPreviewBudget = 300', 'g_cRegexPreviewWorkers = 2', 'g_cActiveRegexPreviewWorkers', 'QThreadPool::globalInstance()', 'm_fWorkerRunning', 'm_fPreviewRerunRequested', 'sltPreviewTimedOut', 'md3RegexBuilderScrollArea')) {
            if (($regexBuilderHeader + $regexBuilderSource) -notmatch [regex]::Escape($pattern)) { throw "Regex validation contract missing: $pattern" }
          }
          if (-not (Test-Path doc/md3/RegexBuilder.md)) { throw 'Missing full regex-builder article' }
          $tabManagerHeader = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3TabManager.h -Raw
          $tabManagerSource = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3TabManager.cpp -Raw
          foreach ($pattern in @('class SHARED_LIBRARY_STUFF UIMd3TabManager', 'tab-manager-current-strip', 'tab-manager-group-names', 'tab-manager-group/', 'tab-manager-master-all-windows', 'tab-manager-close-containing', 'tab-manager-close-not-containing', 'QHash<QString, QPointer<UIMd3SearchField>', 'g_liveTabStrips', 'SearchCandidateRole', 'StripTokenRole', 'GroupIdRole', 'activateItem', 'showItemActions', 'previewClose', 'resolveCloseSet', 'm_pendingCloseIds', 'm_fPendingIncludePinned', 'preview-changed', 'Include pinned tabs', 'Close reviewed tabs', 'QAccessibleAnnouncementEvent', 'availableGeometry', 'QScrollArea')) {
            if (($tabManagerHeader + $tabManagerSource) -notmatch [regex]::Escape($pattern)) { throw "Four-scope tab-manager contract missing: $pattern" }
          }
          $widgetSource = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3Widget.cpp -Raw
          foreach ($pattern in @('md3.appearance.edit', 'md3.appearance.edit-for', 'md3.appearance.search-actions', 'md3.appearance.search-menu')) {
            if ($widgetSource -notmatch [regex]::Escape($pattern)) { throw "Appearance-menu language contract missing: $pattern" }
          }
          $mainSource = Get-Content src/VBox/Frontends/VirtualBox/src/main.cpp -Raw
          foreach ($pattern in @('UIMd3History.h', 'UIMd3History::create()', 'UIMd3History::destroy()', 'UIMd3NotificationCentre::create()', 'UIMd3NotificationCentre::destroy()')) {
            if ($mainSource -notmatch [regex]::Escape($pattern)) { throw "Notification lifecycle missing: $pattern" }
          }
          $managerHeader = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3ManagerHeader.h -Raw
          $managerSource = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3ManagerHeader.cpp -Raw
          foreach ($pattern in @('UIMd3NotificationCentre.h', 'showCentre', 'hasUnread', 'updateNotificationState', 'updateChromeText', 'sigLanguageChanged', 'm_pMenu', 'm_pMinimize', 'm_pMaximize', 'm_pClose', 'manager-header/menu', 'manager-header/minimize', 'manager-header/maximize', 'manager-header/close', 'manager-header/notifications')) {
            if (($managerHeader + $managerSource) -notmatch [regex]::Escape($pattern)) { throw "Manager notification action contract missing: $pattern" }
          }
          $managerSource = Get-Content src/VBox/Frontends/VirtualBox/src/manager/UIVirtualBoxManager.cpp -Raw
          foreach ($pattern in @('UIMd3History.h', 'Qt::CTRL | Qt::Key_H', 'Open local history', 'UIMd3History::instance()->showCentre')) {
            if ($managerSource -notmatch [regex]::Escape($pattern)) { throw "Manager history action contract missing: $pattern" }
          }
          $actionPoolManager = Get-Content src/VBox/Frontends/VirtualBox/src/globals/UIActionPoolManager.cpp -Raw
          if ($actionPoolManager -notmatch [regex]::Escape('QKeySequence("Ctrl+Shift+H")')) { throw 'Network-manager shortcut was not moved off Ctrl+H' }
      - name: Validate notification search integration
        shell: pwsh
        run: |
          $notificationSource = Get-Content src/VBox/Frontends/VirtualBox/src/notificationcenter/UINotificationCenter.cpp -Raw
          foreach ($pattern in @('UIMd3SearchField', 'updateItemVisibility', 'pObject->name\(\)', 'pObject->details\(\)', 'pObject->internalName\(\)', 'pObject->helpKeyword\(\)', 'isExtendedMode\(\) \|\| pItem->isCritical\(\)', 'UIMd3NotificationCentre::instance\(\)->post', 'fPersistHistory')) {
            if ($notificationSource -notmatch $pattern) { throw "Notification search contract missing: $pattern" }
          }
           if (-not (Test-Path doc/md3/NotificationCentre.md)) { throw 'Missing notification-center article' }
      - name: Validate notification row accessibility
        shell: pwsh
        run: |
          $rowSource = Get-Content src/VBox/Frontends/VirtualBox/src/notificationcenter/UINotificationObjectItem.cpp -Raw
          foreach ($pattern in @('setFocusPolicy(Qt::StrongFocus)', 'setAccessibleName', 'setAccessibleDescription', 'Press Enter, Return, or Space', 'QEvent::FocusIn', 'QEvent::FocusOut', 'QEvent::KeyPress', 'Qt::Key_Enter', 'Qt::Key_Return', 'Qt::Key_Space', 'hasFocus()', 'QPen', 'Notification details')) {
            if ($rowSource -notmatch [regex]::Escape($pattern)) { throw "Notification row accessibility contract missing: $pattern" }
          }
          if (-not (Test-Path doc/md3/NotificationCentre.md)) { throw 'Missing notification-center article' }
      - name: Validate tab group picker integration
        shell: pwsh
        run: |
          $tabHeader = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3TabStrip.h -Raw
          $tabSource = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3TabStrip.cpp -Raw
          foreach ($pattern in @('showGroupPicker', 'Move… into group…', 'tab-group-picker', 'QListWidget', 'createGroup', 'Create group…', 'Rename group:', 'Edit group appearance…:', 'QInputDialog', 'setMaxLength', 'QContextMenuEvent::Keyboard', 'm_strCurrentId', 'mapToGlobal', 'Tab actions', 'member', 'QToolButton', 'Show more tabs', 'updateOverflowButton')) {
            if (($tabHeader + $tabSource) -notmatch [regex]::Escape($pattern)) { throw "Tab group picker contract missing: $pattern" }
          }
          if (-not (Test-Path doc/md3/TabNavigation.md)) { throw 'Missing tab-navigation article' }
      - name: Collect safe validation evidence
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          git status --short | Set-Content artifacts/git-status.txt
          git rev-parse HEAD | Set-Content artifacts/revision.txt
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: md3-validation-evidence
          path: artifacts
          if-no-files-found: warn
          retention-days: 7

  tonal-palette:
    # The colour science is the one part of the theme that can be proven by running it
    # rather than by matching source patterns, so it gets a compiled gate of its own.
    # UIMd3Hct depends on no Qt, so this needs nothing beyond a C++ compiler.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the HCT tonal-palette testcase
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -DIN_RING3 \
            -I include \
            -I src/VBox/Frontends/VirtualBox/src/globals \
            -I src/VBox/Frontends/VirtualBox/src/md3 \
            -o tstUIMd3Hct \
            src/VBox/Frontends/VirtualBox/testcase/tstUIMd3Hct.cpp \
            src/VBox/Frontends/VirtualBox/src/md3/UIMd3Hct.cpp
          ./tstUIMd3Hct
      - name: Validate the tonal-palette contract
        shell: pwsh
        run: |
          $make = Get-Content src/VBox/Frontends/VirtualBox/Makefile.kmk -Raw
          foreach ($path in @('src/md3/UIMd3Hct.cpp','testcase/tstUIMd3Hct.cpp')) {
            if ($make -notmatch [regex]::Escape($path)) { throw "Missing kBuild source: $path" }
          }
          $makeLines = Get-Content src/VBox/Frontends/VirtualBox/Makefile.kmk
          $uiCommonSourcesAt = ($makeLines | Select-String '^UICommon_SOURCES =').LineNumber
          $uiCommonSources = ($makeLines[($uiCommonSourcesAt - 1)..($makeLines.Count - 1)] -join "`n")
          if ($uiCommonSources -notmatch [regex]::Escape('src/md3/UIMd3Hct.cpp')) {
            throw 'Shared colour science must be linked by UICommon'
          }
          $hctHeader = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3Hct.h -Raw
          $hctSource = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3Hct.cpp -Raw
          foreach ($pattern in @('md3HctFromRgb', 'md3HctToRgb', 'md3LstarFromRgb', 'UIMd3ViewingConditions', 'md3Cam16FromRgb', 'md3SolveToneAtChroma', 'md3IsInGamut')) {
            if (($hctHeader + $hctSource) -notmatch [regex]::Escape($pattern)) { throw "HCT contract missing: $pattern" }
          }
          $themeSource = Get-Content src/VBox/Frontends/VirtualBox/src/md3/UIMd3Theme.cpp -Raw
          foreach ($pattern in @('UIMd3Hct.h', 'md3HctFromRgb', 'paletteTone', 'dPrimaryChroma', 'dNeutralVariantChroma')) {
            if ($themeSource -notmatch [regex]::Escape($pattern)) { throw "Theme palette contract missing: $pattern" }
          }
          # The palettes must come from HCT, not from a perceptually wrong stand-in.
          if ($themeSource -match 'setHslF|getHslF|approximate HCT|Approximate the HCT') {
            throw 'Tonal palettes must be generated in HCT, not approximated in HSL'
          }
          if ($themeSource -match 'fromHsvF') { throw 'Palette bases must be derived in HCT, not HSV' }
          if (-not (Test-Path doc/md3/TonalPalette.md)) { throw 'Missing tonal-palette article' }
